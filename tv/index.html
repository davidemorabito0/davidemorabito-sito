/* Telecomando sul telefono: comandi grandi, si usa con una mano mentre si gira. */
:root {
  --ink: #0f1c2e;
  --ink-2: #16273d;
  --ink-3: #1f3550;
  --navy: #2b4868;
  --amber: #ffad01;
  --paper: #f2f4f7;
  --mute: #93a4b8;
  --tally: #e3262f;
  --go: #2fbf71;
  --display: 'Sora', 'DM Sans', system-ui, sans-serif;
  --text: 'DM Sans', system-ui, sans-serif;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font: 400 16px/1.45 var(--text);
  -webkit-font-smoothing: antialiased;
}

body {
  padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  max-width: 560px;
  margin: 0 auto;
}

button,
input,
textarea {
  font: inherit;
  color: inherit;
}

.mark {
  width: 34px;
  height: 34px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--navy) 50%, var(--amber) 50%);
  flex: none;
}

.mark.big {
  width: 64px;
  height: 64px;
  border-radius: 12px;
  margin: 8px auto 18px;
}

.top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.top h1 {
  margin: 0;
  font: 700 20px/1.15 var(--display);
}

.link-state {
  display: flex;
  align-items: center;
  gap: 7px;
  margin: 2px 0 0;
  font-size: 14px;
  color: var(--mute);
}

.link-state::before {
  content: '';
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #9aa7b5;
}

.link-state[data-kind='ok']::before {
  background: var(--go);
}

.link-state[data-kind='bad']::before {
  background: var(--tally);
}

.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin: 0 -16px 14px;
  padding: 0 16px 2px;
  scrollbar-width: none;
}

.tabs[hidden] {
  display: none;
}

.tabs .tab {
  flex: none;
  padding: 8px 14px;
  border: 1px solid #2e4560;
  border-radius: 999px;
  background: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--mute);
}

.tabs .tab.on {
  border-color: var(--amber);
  color: var(--paper);
}

.view {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.nosignal .view {
  opacity: 0.55;
}

.card {
  padding: 16px;
  border-radius: 16px;
  background: var(--ink-2);
}

.card h2 {
  margin: 0 0 12px;
  font: 700 17px var(--display);
}

.card h3 {
  margin: 18px 0 10px;
  font-size: 14px;
  font-weight: 600;
  color: var(--mute);
}

.note {
  margin: 0 0 12px;
  font-size: 14px;
  color: var(--mute);
}

.btn {
  min-height: 48px;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: var(--ink-3);
  font-weight: 700;
}

.btn.primary {
  background: var(--amber);
  color: var(--ink);
}

.btn.ghost {
  background: var(--ink-3);
}

.btn.wide {
  width: 100%;
  margin-top: 10px;
}

.btn:active,
.pill:active,
.chip:active,
.item:active {
  transform: scale(0.97);
}

.inline {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.inline input {
  flex: 1;
  min-width: 0;
}

input[type='text'],
input[type='url'],
input[type='number'],
textarea {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #2e4560;
  border-radius: 12px;
  background: var(--ink);
  outline: none;
}

textarea {
  resize: vertical;
  line-height: 1.5;
  margin-top: 8px;
}

input:focus,
textarea:focus {
  border-color: var(--amber);
}

/* cursori */
.slider {
  display: block;
  margin: 6px 0 14px;
}

.slider-top {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 14px;
  font-weight: 600;
}

.slider-val {
  font-family: var(--display);
  color: var(--amber);
}

input[type='range'] {
  width: 100%;
  height: 36px;
  margin: 0;
  background: transparent;
  -webkit-appearance: none;
  appearance: none;
}

input[type='range']::-webkit-slider-runnable-track {
  height: 10px;
  border-radius: 6px;
  background: #2e4560;
}

input[type='range']::-moz-range-track {
  height: 10px;
  border-radius: 6px;
  background: #2e4560;
}

input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 30px;
  height: 30px;
  margin-top: -10px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--amber);
}

input[type='range']::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: var(--amber);
}

.hue input::-webkit-slider-runnable-track {
  background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
}

.hue input::-moz-range-track {
  background: linear-gradient(90deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
}

.kelvin input::-webkit-slider-runnable-track {
  background: linear-gradient(90deg, #ff8912, #ffb46b, #ffe4ce, #fff9fd, #dde6ff, #c6d7ff);
}

.kelvin input::-moz-range-track {
  background: linear-gradient(90deg, #ff8912, #ffb46b, #ffe4ce, #fff9fd, #dde6ff, #c6d7ff);
}

.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  margin-bottom: 14px;
  border-radius: 12px;
  background: var(--ink);
  overflow-x: auto;
}

.seg button {
  flex: 1 0 auto;
  min-height: 40px;
  padding: 0 10px;
  border: 0;
  border-radius: 9px;
  background: none;
  font-size: 14px;
  font-weight: 600;
  color: var(--mute);
}

.seg button.on {
  background: var(--ink-3);
  color: var(--paper);
  box-shadow: inset 0 -3px 0 var(--amber);
}

.toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 52px;
  margin-top: 6px;
  padding: 0 4px;
  border: 0;
  background: none;
  font-weight: 600;
  text-align: left;
}

.toggle::after {
  content: '';
  width: 52px;
  height: 30px;
  border-radius: 999px;
  background: #2e4560 radial-gradient(circle at 15px 15px, var(--paper) 11px, transparent 12px);
  transition: background-position 0.15s;
}

.toggle[aria-checked='true']::after {
  background: var(--amber) radial-gradient(circle at 37px 15px, var(--ink) 11px, transparent 12px);
}

/* scelte del fondale: gelatine come nella mazzetta */
.swatch {
  position: relative;
  height: 148px;
  border-radius: 16px;
  background: #1f3550;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}

.swatch-label {
  position: absolute;
  left: 12px;
  bottom: 12px;
  padding: 5px 10px;
  border-radius: 8px;
  background: rgba(15, 28, 46, 0.82);
  font-size: 13px;
  font-weight: 700;
}

.chips {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
  gap: 8px;
  margin-top: 12px;
}

.chip {
  padding: 5px 5px 8px;
  border: 0;
  border-radius: 10px;
  background: var(--paper);
  color: var(--ink);
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.2;
  text-align: left;
}

.chip-gel {
  display: block;
  height: 44px;
  margin-bottom: 6px;
  border-radius: 6px;
}

.chips.text {
  display: flex;
  flex-wrap: wrap;
}

.pill {
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid #2e4560;
  border-radius: 999px;
  background: var(--ink);
  font-weight: 600;
}

.list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.item {
  min-height: 48px;
  padding: 10px 12px;
  border: 0;
  border-radius: 12px;
  background: var(--ink-3);
  font-weight: 600;
  text-align: left;
}

.item.split {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.item.current {
  box-shadow: inset 3px 0 0 var(--amber);
}

.acts {
  display: flex;
  align-items: center;
  gap: 6px;
}

.acts em {
  font-style: normal;
  font-size: 13px;
  color: var(--amber);
}

.mini {
  min-height: 36px;
  padding: 0 12px;
  border: 0;
  border-radius: 9px;
  background: var(--amber);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
}

.mini.ghost {
  background: var(--ink);
  color: var(--paper);
}

/* grandi comandi di riproduzione */
.row3 {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
}

.row3 .btn {
  min-width: 0;
  padding: 0 6px;
  font-size: 15px;
}

.row3.small {
  grid-template-columns: 1fr 1fr 1fr;
  margin-top: 12px;
}

.big-play {
  width: 88px;
  height: 88px;
  border: 0;
  border-radius: 50%;
  background: var(--amber);
  position: relative;
}

.big-play::before {
  content: '';
  position: absolute;
  left: 34px;
  top: 26px;
  border-left: 30px solid var(--ink);
  border-top: 18px solid transparent;
  border-bottom: 18px solid transparent;
}

.big-play.playing::before {
  left: 29px;
  top: 27px;
  width: 30px;
  height: 34px;
  border: 0;
  background: linear-gradient(90deg, var(--ink) 0 11px, transparent 11px 19px, var(--ink) 19px);
}

/* timer: com'e' sulla TV */
.t-status {
  padding: 18px 16px;
  border-radius: 16px;
  background: var(--ink-2);
  text-align: center;
  transition: background-color 0.4s;
}

.t-status[data-tally='warn'] {
  background: var(--amber);
  color: var(--ink);
}

.t-status[data-tally='over'] {
  background: var(--tally);
  color: #fff;
}

.t-pos,
.t-next {
  margin: 0;
  font-size: 14px;
  opacity: 0.75;
}

.t-who {
  margin: 2px 0 0;
  font: 700 18px var(--display);
}

.t-clock {
  margin: 4px 0;
  font: 800 64px/1 var(--display);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}

.t-msg {
  margin: 8px 0 0;
  font-size: 14px;
  font-weight: 700;
}

.t-msg:empty {
  display: none;
}

.rows {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.srow {
  display: grid;
  grid-template-columns: 22px 1fr 72px 30px 36px;
  align-items: center;
  gap: 6px;
}

.srow-n {
  font: 700 14px var(--display);
  color: var(--mute);
}

.srow-u {
  font-size: 13px;
  color: var(--mute);
}

.srow input[type='number'] {
  padding: 12px 8px;
  text-align: center;
}

.x {
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: 50%;
  background: var(--ink-3);
  font-size: 20px;
  line-height: 1;
}

/* gobbo */
.g-status {
  padding: 16px;
  border-radius: 16px;
  background: var(--ink-2);
}

.g-title {
  margin: 0 0 10px;
  font: 700 17px var(--display);
}

.g-bar {
  height: 8px;
  border-radius: 5px;
  background: #2e4560;
  overflow: hidden;
}

.g-bar i {
  display: block;
  width: 0;
  height: 100%;
  background: var(--amber);
}

.empty {
  margin-top: 40px;
  padding: 24px;
  border-radius: 18px;
  background: var(--ink-2);
  text-align: center;
}

.empty h2 {
  margin: 0 0 10px;
  font: 700 20px var(--display);
}

.empty p {
  margin: 0;
  color: var(--mute);
}

.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 10;
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
  font-weight: 700;
  opacity: 0;
  transform: translate(-50%, 12px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}

.toast.on {
  opacity: 1;
  transform: translate(-50%, 0);
}

</style>
</head>
<body>
<header class="top">
  <div class="mark" aria-hidden="true"></div>
  <div class="top-text">
    <h1 id="app-name">Telecomando TV</h1>
    <p id="link-state" class="link-state" data-kind="wait">Mi collego…</p>
  </div>
</header>
<nav id="tabs" class="tabs" hidden></nav>
<main id="view"></main>
<div id="toast" class="toast" role="status"></div>
