<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<!-- IDRATATI v3.1 (2026-07-27) -->
<title>IDRATATI — Idràtati, per rimanere idratàti</title>
<meta name="description" content="Idràtati, per rimanere idratàti. Trova la fontanella pubblica più vicina, sai se funziona prima di arrivarci e ci arrivi a piedi.">
<meta name="theme-color" content="#07242F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="IDRATATI">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07242F; --ink-2:#123A4A;
  --surface:#F2F7F6; --card:#FFFFFF;
  --acqua:#00A6A6; --acqua-deep:#00807F;
  --getto:#FFB020; --rotta:#E5484D;
  --muted:rgba(7,36,47,.58); --line:rgba(7,36,47,.10);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Inter Tight',system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Su iPhone l'altezza della finestra cambia in continuazione: la barra di
   Safari si ritrae, l'app installata ha la sua area sicura in basso. Invece
   di rincorrere quel numero, si inchioda tutto allo schermo. */
html{background:var(--ink)}
html,body{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
}
body{font-family:var(--body);background:transparent;color:var(--ink);
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none}
/* si scrive solo dove serve scrivere */
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acqua);outline-offset:2px}

/* ---------- SPLASH ---------- */
#splash{position:fixed;inset:0;z-index:9000;background:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  transition:opacity .45s ease,visibility .45s}
#splash.gone{opacity:0;visibility:hidden}
.drop-stage{width:min(46vw,168px);height:min(46vw,168px)}
.drop-stage svg{width:100%;height:100%;display:block;shape-rendering:geometricPrecision}
.rp{opacity:0;animation:rp 2.1s cubic-bezier(.2,.7,.3,1) infinite}
.rp2{animation-delay:.45s} .rp3{animation-delay:.9s}
@keyframes rp{0%{r:12px;opacity:0}14%{opacity:.8}100%{r:118px;opacity:0}}
.dropg{animation:fall 2.1s cubic-bezier(.5,0,.35,1) infinite}
@keyframes fall{0%{transform:translateY(-130px);opacity:0}20%{opacity:1}
  46%{transform:translateY(0);opacity:1}62%,100%{transform:translateY(0);opacity:0}}
.wordmark{position:relative;font-family:var(--display);font-weight:800;
  font-size:clamp(28px,8.6vw,40px);letter-spacing:.15em;color:var(--surface);
  margin-left:.15em;line-height:1;white-space:nowrap}
.wordmark span{display:inline-block}
.acc{position:absolute;top:-.30em;left:0;width:.09em;height:.26em;background:var(--acqua);
  border-radius:.05em;transform:rotate(-22deg);transform-origin:50% 100%;
  opacity:0;transition:left .85s cubic-bezier(.65,0,.25,1),opacity .35s ease}
.ver{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 8px);left:0;right:0;
  text-align:center;font-size:10px;letter-spacing:.1em;color:rgba(242,247,246,.28);
  z-index:9001;pointer-events:none}
#splash.gone ~ .ver{display:none}
.tagline{font-size:clamp(9.5px,2.7vw,11.5px);letter-spacing:.13em;text-transform:uppercase;
  font-weight:500;color:var(--acqua);margin-top:-4px;text-align:center;padding:0 18px;line-height:1.5}
@media (prefers-reduced-motion:reduce){ .acc{transition:none} }

/* ---------- MAPPA ---------- */
#map{position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;height:100%;background:#dfe8e7}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.82);
  font-family:var(--body);padding-bottom:calc(env(safe-area-inset-bottom) * .5)}
.leaflet-control-zoom{display:none}

/* ---------- TOP ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:600;
  padding:calc(var(--safe-t) + 9px) 10px 0;display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.13em;
  color:var(--surface);background:var(--ink);padding:10px 12px;border-radius:999px;
  white-space:nowrap;flex:0 0 auto;box-shadow:0 4px 18px rgba(7,36,47,.28)}
#search{flex:1;min-width:0;border:none;border-radius:999px;padding:11px 14px;font-size:14px;
  font-family:var(--body);background:rgba(255,255,255,.95);color:var(--ink);
  box-shadow:0 4px 14px rgba(7,36,47,.18)}
#search::placeholder{color:rgba(7,36,47,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:11.5px;font-weight:600;border:none;cursor:pointer;padding:8px 11px;
  border-radius:999px;white-space:nowrap;background:rgba(255,255,255,.95);color:var(--ink);
  box-shadow:0 3px 12px rgba(7,36,47,.16);display:flex;align-items:center;gap:5px;flex:0 0 auto}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--acqua)}
.chip.casa .dot{background:var(--getto)}
.chip.okonly .dot{background:var(--acqua-deep)}
.chip.freeonly .dot{background:var(--getto)}
.chip.access .dot{background:#1E7BFF}
.chip.dog .dot{background:#9B6BD8}
.chip[aria-pressed="false"]{background:rgba(255,255,255,.5);color:rgba(7,36,47,.38)}
.chip[aria-pressed="false"] .dot{background:rgba(7,36,47,.18)}
#results{position:absolute;left:10px;right:10px;top:calc(var(--safe-t) + 58px);
  background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(7,36,47,.24);display:none}
#results.on{display:block}
#results button{display:block;width:100%;text-align:left;border:none;background:none;
  padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);cursor:pointer}
#results button:last-child{border-bottom:none}

/* ---------- MARKER ---------- */
.pin{position:relative;width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:var(--acqua);border:2px solid #fff;box-shadow:0 3px 10px rgba(7,36,47,.35);
  display:flex;align-items:center;justify-content:center}
.pin .fee{position:absolute;top:-6px;right:-7px;width:17px;height:17px;border-radius:50%;
  background:var(--ink);color:var(--getto);border:1.5px solid #fff;
  font-family:var(--body);font-size:10px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;transform:rotate(45deg)}
.pin.casa .fee{transform:rotate(0);top:-7px;right:-7px}
.pin.casa{background:var(--getto);border-radius:9px;transform:rotate(0)}
.pin.broken{background:var(--rotta)}
.pin svg{transform:rotate(45deg)}
.pin.casa svg{transform:rotate(0)}
.pin.sel{box-shadow:0 0 0 5px rgba(0,166,166,.3),0 3px 10px rgba(7,36,47,.35)}
.grappolo{width:38px;height:38px;border-radius:50%;background:rgba(0,166,166,.92);
  border:2.5px solid #fff;box-shadow:0 3px 12px rgba(7,36,47,.35);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--body);font-size:13px;font-weight:600}
.grappolo.grande{width:46px;height:46px;font-size:14px;background:rgba(0,128,127,.94)}
.me{width:18px;height:18px;border-radius:50%;background:#1E7BFF;border:3px solid #fff;
  box-shadow:0 0 0 6px rgba(30,123,255,.18),0 2px 8px rgba(0,0,0,.3)}

/* ---------- CARD "PIÙ VICINA" ---------- */
#card{position:fixed;left:10px;right:10px;z-index:700;bottom:calc(var(--safe-b) + 12px);
  background:var(--surface);border-radius:20px;padding:15px 16px 16px;
  box-shadow:0 -2px 40px rgba(7,36,47,.22);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#card.hidden{transform:translateY(calc(100% + 40px))}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acqua-deep);font-weight:600}
.headline{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.08;
  margin:7px 0 3px;letter-spacing:-.01em}
.headline b{font-weight:800;color:var(--acqua-deep)}
.sub{font-size:13.5px;color:var(--muted);line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;
  background:rgba(7,36,47,.06);color:rgba(7,36,47,.72)}
.tag.ok{background:rgba(0,166,166,.13);color:var(--acqua-deep)}
.tag.warn{background:rgba(255,176,32,.2);color:#8A5B00}
.tag.bad{background:rgba(229,72,77,.13);color:var(--rotta)}
.actions{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;border:none;cursor:pointer;font-size:14px;font-weight:600;padding:13px 10px;
  border-radius:13px;background:var(--ink);color:var(--surface);text-decoration:none;
  display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:rgba(7,36,47,.07);color:var(--ink)}
.btn.small{padding:10px;font-size:13px;border-radius:11px}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.5;pointer-events:none}
.close{position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;
  border:none;cursor:pointer;background:rgba(7,36,47,.07);color:var(--ink);font-size:17px;line-height:1}

/* ---------- SHEET ---------- */
#scrim{position:fixed;inset:0;z-index:750;background:rgba(7,36,47,.45);
  opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:800;background:var(--surface);
  border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .34s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -6px 40px rgba(7,36,47,.3)}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:999px;background:rgba(7,36,47,.18);margin:9px auto 0;flex:0 0 auto}
.sheet-close{position:absolute;top:12px;right:12px;z-index:5;width:36px;height:36px;
  border:none;border-radius:50%;background:rgba(229,72,77,.12);color:var(--rotta);
  font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .16s}
.sheet-close:active{background:rgba(229,72,77,.22)}
.sheet-body > .eyebrow,.sheet-body > .sheet-h{padding-right:46px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(var(--safe-b) + 18px)}
.sheet-h{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:10px 0 2px}
.hero{width:100%;height:170px;object-fit:cover;border-radius:14px;margin-top:12px;background:rgba(7,36,47,.06);display:block}
.gallery{display:flex;gap:8px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{height:78px;border-radius:10px;flex:0 0 auto}
.sec{margin-top:20px}
.sec-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:9px}
.tempseg{display:flex;gap:4px;background:rgba(7,36,47,.06);border-radius:13px;padding:4px;margin-top:2px}
.tempseg button{flex:1;border:none;background:none;color:var(--muted);padding:11px 6px;
  border-radius:10px;font-size:13px;font-weight:600;font-family:var(--body);transition:.16s}
.tempseg button.on[data-v="1"]{background:#F5A623;color:#3d2600}
.tempseg button.on[data-v="3"]{background:rgba(7,36,47,.75);color:var(--surface)}
.tempseg button.on[data-v="5"]{background:#31B6D8;color:#04222c}
.temprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:13.5px}
.tempval{font-weight:600;padding:4px 11px;border-radius:8px;font-size:12.5px}
.tempval.calda{background:rgba(245,166,35,.2);color:#8A5B00}
.tempval.ambiente{background:rgba(7,36,47,.08);color:var(--muted)}
.tempval.fresca{background:rgba(49,182,216,.18);color:#0A5C72}
.starrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.starrow span{font-size:13.5px}
.stars{display:flex;gap:3px;flex:0 0 auto}
.star{width:26px;height:26px;border:none;background:none;padding:0;cursor:pointer;color:rgba(7,36,47,.2)}
.star.on{color:var(--getto)}
.star svg{width:100%;height:100%;display:block}
.bar{height:6px;border-radius:99px;background:rgba(7,36,47,.09);overflow:hidden;flex:1;max-width:110px}
.bar i{display:block;height:100%;background:var(--acqua);border-radius:99px}
.statebox{display:flex;gap:8px;margin-top:4px}
.statebox .btn{font-size:13.5px}
.btn.ok{background:rgba(0,166,166,.14);color:var(--acqua-deep)}
.btn.bad{background:rgba(229,72,77,.12);color:var(--rotta)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  font-family:var(--body);font-size:14px;background:var(--card);color:var(--ink);resize:none}
.hint{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:8px}
.age{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;
  background:rgba(7,36,47,.07);color:var(--muted)}
.age.fresh{background:rgba(0,166,166,.15);color:var(--acqua-deep)}
.age.medium{background:rgba(255,176,32,.2);color:#8A5B00}
.age.stale{background:rgba(7,36,47,.08);color:rgba(7,36,47,.45)}
.modeseg{display:inline-flex;gap:2px;background:rgba(7,36,47,.06);border-radius:10px;padding:2px;margin-top:9px}
.modeseg button{border:none;background:none;color:var(--muted);padding:6px 11px;
  border-radius:8px;font-size:12px;font-weight:600;font-family:var(--body)}
.modeseg button.on{background:var(--ink);color:var(--surface)}
.state3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:4px}
.state3 .btn{font-size:12.5px;padding:12px 4px;border-radius:11px}
.btn.works{background:rgba(255,176,32,.2);color:#8A5B00}
.photocap{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:var(--muted)}
.rev{border-top:1px solid var(--line);padding:11px 0;font-size:13.5px}
.rev .meta{font-size:11px;color:var(--muted);margin-bottom:3px}
.empty{font-size:13px;color:var(--muted);padding:12px 0}

/* ---------- FAB ---------- */
.fab{position:fixed;right:12px;z-index:650;width:46px;height:46px;border-radius:15px;border:none;
  cursor:pointer;background:var(--surface);color:var(--ink);box-shadow:0 5px 18px rgba(7,36,47,.24);
  display:flex;align-items:center;justify-content:center;transition:bottom .32s cubic-bezier(.2,.8,.2,1)}
#locate{bottom:calc(var(--safe-b) + 178px)}
#addBtn{bottom:calc(var(--safe-b) + 234px);background:var(--acqua);color:#fff}
body.card-hidden #locate{bottom:calc(var(--safe-b) + 24px)}
body.card-hidden #addBtn{bottom:calc(var(--safe-b) + 80px)}

/* ---------- MODALITÀ AGGIUNTA ---------- */
#addbar{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 12px);z-index:900;
  max-width:430px;margin:0 auto;background:var(--ink);color:var(--surface);
  border-radius:20px;padding:18px;display:none;
  box-shadow:0 20px 60px rgba(7,36,47,.45);
  max-height:calc(100vh - 120px);overflow-y:auto}
#addbar.on{display:block}
.add-t{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.2;margin:0 0 4px}
.add-p{margin:0;font-size:13px;line-height:1.45;color:rgba(242,247,246,.62)}
.add-l{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(242,247,246,.45);font-weight:600;margin:16px 0 7px}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:13px;padding:3px}
.seg button{flex:1;border:none;background:none;color:rgba(242,247,246,.6);
  padding:10px 8px;border-radius:10px;font-size:13px;font-weight:600;transition:.18s}
.seg button.on{background:var(--acqua);color:#04222c}
.seg button.on.casa{background:var(--getto);color:#3d2800}
#addbar input[type=text],#addbar textarea{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:12px;padding:11px 13px;color:var(--surface);font-size:14px;
  font-family:var(--body);resize:none}
#addbar input[type=text]::placeholder,#addbar textarea::placeholder{color:rgba(242,247,246,.35)}
#addbar input[type=text]:focus,#addbar textarea:focus{border-color:var(--acqua);outline:none}
.photo-zone{display:flex;gap:10px;align-items:center}
.photo-add{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;
  background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.22);
  border-radius:12px;padding:14px 10px;font-size:13px;font-weight:600;
  color:rgba(242,247,246,.78);cursor:pointer;transition:.18s}
.photo-add:hover{border-color:var(--acqua);color:var(--surface)}
.photo-prev{position:relative;flex:0 0 auto}
.photo-prev img{width:62px;height:62px;object-fit:cover;border-radius:12px;display:block}
.photo-prev button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border:none;
  border-radius:50%;background:var(--rotta);color:#fff;font-size:13px;line-height:1;padding:0}
.add-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.b{border:none;border-radius:12px;padding:11px 20px;font-size:13.5px;font-weight:600;
  font-family:var(--body);transition:.18s;cursor:pointer}
.b.ghost{background:rgba(255,255,255,.1);color:var(--surface)}
.b.ghost:hover{background:rgba(255,255,255,.16)}
.b.go{background:var(--acqua);color:#04222c}
.b.go:hover{filter:brightness(1.08)}
.b[disabled]{opacity:.45;pointer-events:none}
.add-hint{font-size:11.5px;line-height:1.45;color:rgba(242,247,246,.45);margin-top:12px}
#crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-100%);z-index:880;display:none;pointer-events:none}
#crosshair.on{display:block}

/* Mentre tieni premuto, la cornice dello schermo si chiude in due secondi.
   Sta ai bordi apposta: il dito è al centro e coprirebbe qualsiasi cosa. */
#lpfull{position:fixed;inset:0;z-index:940;pointer-events:none;opacity:0;transition:opacity .14s}
#lpfull.on{opacity:1}
#lpfull i{position:absolute;display:block;background:var(--acqua);
  box-shadow:0 0 14px rgba(0,166,166,.55)}
#lpfull .t{top:0;left:0;width:100%;height:6px;transform:scaleX(0);transform-origin:left}
#lpfull .r{top:0;right:0;width:6px;height:100%;transform:scaleY(0);transform-origin:top}
#lpfull .b{bottom:0;right:0;width:100%;height:6px;transform:scaleX(0);transform-origin:right}
#lpfull .l{bottom:0;left:0;width:6px;height:100%;transform:scaleY(0);transform-origin:bottom}
#lpfull.on .t{animation:cresceX .325s linear forwards}
#lpfull.on .r{animation:cresceY .325s linear .325s forwards}
#lpfull.on .b{animation:cresceX .325s linear .65s forwards}
#lpfull.on .l{animation:cresceY .325s linear .975s forwards}
@keyframes cresceX{to{transform:scaleX(1)}}
@keyframes cresceY{to{transform:scaleY(1)}}
#lpfull .lp-label{position:absolute;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top) + 118px);
  background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:600;
  padding:10px 16px;border-radius:999px;white-space:nowrap;
  box-shadow:0 6px 22px rgba(7,36,47,.35)}

/* il segnaposto piazzato tenendo premuto */
.prop-pin{width:34px;height:34px;border-radius:50% 50% 50% 5px;transform:rotate(-45deg);
  background:var(--acqua);border:3px solid #fff;box-shadow:0 4px 14px rgba(7,36,47,.45);

<script>
(function(){

/* ============================================================

var CFG = {
  SUPABASE_URL: 'https://usaagxlsqmxbcagiwnoz.supabase.co',
  // INCOLLA QUI SOTTO la chiave anon public (Supabase > Project Settings > API)
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzYWFneGxzcW14YmNhZ2l3bm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDU4NjYsImV4cCI6MjEwMDcyMTg2Nn0.IijyrG7pPtn-9E168xVeVIX8mdHUAWDEOHTq998wFHA',
  DATA_BASE: 'data'          // cartella degli snapshot generati da tools/build_data.py
};

var FALLBACK = {lat:45.4642, lon:9.1900, label:'Milano'};
var RADIUS = 2200, TILE = 0.5;

/* Come ci si arriva. I metri al minuto sono reali, non da manuale:
   a piedi 4,8 km/h; in auto 18 km/h di media urbana, più il parcheggio. */
var MODI = {
  piedi:{ v:80,  det:1.25, nome:'a piedi', g:'walking', a:'w', extra:0 },
  auto: { v:300, det:1.40, nome:'in auto', g:'driving', a:'d', extra:3 }
};
var modo = 'piedi';

/* ---------- storage sicuro ---------- */
var mem = {};
var store = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k]||null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
var modoSalvato = store.get('idr_modo');
if(modoSalvato && MODI[modoSalvato]) modo = modoSalvato;
var CLIENT = store.get('idr_client');
if(!CLIENT){
  CLIENT = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,12);
  store.set('idr_client', CLIENT);
}

/* ============================================================
   SUONI E VIBRAZIONE
   Toni sintetizzati sul momento: nessun file da scaricare.
   Il contesto audio nasce al primo tocco, come vogliono i browser.
   ============================================================ */
var suoniAccesi = store.get('idr_suoni') !== '0';
var ctx = null, master = null;

function audioPronto(){
  if(!suoniAccesi) return false;
  try{
    if(!ctx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.5;
      master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return true;
  }catch(e){ return false; }
}

/* tick acuto, uno per ogni lato della cornice che si chiude */
function tick(freq, forza){
  if(!audioPronto()) return;
  var t = ctx.currentTime;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(forza || 0.12, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.13);
}

/* la goccia che cade: la frequenza scivola in basso in un lampo */
function suonoGoccia(){
  if(!audioPronto()) return;
  var t = ctx.currentTime;
  var o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(1350, t);
  o.frequency.exponentialRampToValueAtTime(300, t + 0.14);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.34, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.36);
  // un secondo tonfo più basso, come l'eco nel catino
  var o2 = ctx.createOscillator(), g2 = ctx.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(520, t + 0.10);
  o2.frequency.exponentialRampToValueAtTime(190, t + 0.30);
  g2.gain.setValueAtTime(0.0001, t + 0.10);
  g2.gain.exponentialRampToValueAtTime(0.11, t + 0.12);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  o2.connect(g2); g2.connect(master);
  o2.start(t + 0.10); o2.stop(t + 0.44);
}

/* nota: su iPhone il browser non espone la vibrazione, quindi lì
   resta solo il suono. Su Android funziona. */
function vibra(schema){
  if(!navigator.vibrate) return;
  try{ navigator.vibrate(schema); }catch(e){}
}

/* ---------- mini client Supabase (REST, zero dipendenze) ---------- */
var SB = {
  on: function(){ return !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY); },
  head: function(){
    return {'apikey':CFG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CFG.SUPABASE_ANON_KEY,
            'Content-Type':'application/json'};
  },
  select: function(path){
    if(!SB.on()) return Promise.resolve([]);
    return fetch(CFG.SUPABASE_URL+'/rest/v1/'+path, {headers:SB.head()})
      .then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; });
  },
  insert: function(table, row){
    if(!SB.on()) return Promise.reject(new Error('offline'));
    // return=minimal: non chiediamo indietro la riga. Le proposte e le foto
    // in attesa sono leggibili solo dall'amministratore, quindi chiederle
    // indietro farebbe fallire un inserimento in realtà andato a buon fine.
    return fetch(CFG.SUPABASE_URL+'/rest/v1/'+table, {
      method:'POST',
      headers:Object.assign(SB.head(), {'Prefer':'return=minimal'}),
      body:JSON.stringify(row)
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        var msg=t; try{ msg=(JSON.parse(t).message)||t; }catch(e){}
        throw new Error(msg);
      });
      return true;
    });
  },
  upload: function(file, name){
    if(!SB.on()) return Promise.reject(new Error('offline'));
    return fetch(CFG.SUPABASE_URL+'/storage/v1/object/photos/'+name, {
      method:'POST',
      headers:{'apikey':CFG.SUPABASE_ANON_KEY,'Authorization':'Bearer '+CFG.SUPABASE_ANON_KEY,
               'Content-Type':file.type||'image/jpeg','x-upsert':'false'},
      body:file
    }).then(function(r){
      if(!r.ok) throw new Error('upload');
      return CFG.SUPABASE_URL+'/storage/v1/object/public/photos/'+name;
    });
  }
};

/* ---------- stato ---------- */
var map, layer, meMarker, myPos=null, points=[], byId={},
    overrides={}, statusAgg={}, reviewAgg={},
    selected=null, tilesLoaded={}, fetching=false, lastQ=null,
    adding=false, addPhoto=null, myVotes={},
    lastOverpassAt=0, lastOverpassAt_center=null, firstLoadDone=false;
var show = {fontanella:true, casa:true, okonly:false, freeonly:false, access:false, dog:false};

/* ---------- utility ---------- */
function dist(a,b){
  var R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t;
  var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(s));
}
function walkMin(m, quale){
  var M = MODI[quale || modo];
  return Math.max(1, Math.round(m*M.det/M.v) + M.extra);
}
function fmtDist(m){ return m<1000 ? Math.round(m/10)*10+' m' : (m/1000).toFixed(1).replace('.',',')+' km'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg,ms){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, ms||3200);
}
function daysAgo(iso){
  if(!iso) return null;
  return Math.floor((Date.now()-new Date(iso).getTime())/86400000);
}
function agoText(d){
  if(d==null) return null;
  if(d<1) return 'oggi'; if(d===1) return 'ieri';
  if(d<30) return d+' giorni fa';
  if(d<365) return Math.round(d/30)+' mesi fa';
  return 'oltre un anno fa';
}
/* Quanto è vecchia un'informazione. Una nota di ieri vale molto più
   di una di due anni fa, e chi legge deve vederlo a colpo d'occhio. */
function fresco(iso){
  var d = daysAgo(iso);
  if(d==null) return {c:'', t:''};
  if(d <= 30)  return {c:'fresh',  t:agoText(d)};
  if(d <= 180) return {c:'medium', t:agoText(d)};
  return {c:'stale', t:agoText(d)};
}
function bollo(iso, prefisso){
  var f = fresco(iso);
  if(!f.t) return '';
  return '<span class="age '+f.c+'">'+(prefisso?esc(prefisso)+' ':'')+esc(f.t)+'</span>';
}

/* ---------- classificazione OSM ---------- */
function classify(tags){
  var n=(tags.name||'').toLowerCase();
  if(tags.amenity==='vending_machine' || tags.amenity==='water_point') return 'casa';
  if(n.indexOf('casa dell')>-1 || n.indexOf('casa acqua')>-1 || n.indexOf('casetta')>-1) return 'casa';
  if(tags['drinking_water:refill']==='yes' && tags.amenity!=='drinking_water') return 'casa';
  return 'fontanella';
}
function labelFor(p){
  if(p.ov && p.ov.name) return p.ov.name;
  if(p.tags.name) return p.tags.name;
  return p.kind==='casa' ? "Casa dell'acqua" : 'Fontanella pubblica';
}

/* ---------- si paga o no ----------
   Restituisce 'paid', 'free' oppure null quando nessuno l'ha ancora detto. */
function feeOf(p){
  var ov=p.ov||{}, t=p.tags||{};
  if(ov.fee) return ov.fee;
  if(t.fee==='yes' || t.charge) return 'paid';
  if(t.fee==='no') return 'free';
  return null;
}

/* ---------- stato calcolato ---------- */
function stateOf(p){
  var ov=p.ov, ag=statusAgg[p.target];
  if(ov && ov.status_locked && ov.status!=='unknown'){
    return {s:ov.status, why:'verificata', locked:true};
  }
  if(ag){
    var ok=ag.ok_votes||0, ko=ag.broken_votes||0, lv=ag.works_votes||0, sp=ag.missing_votes||0;
    // Due persone che non la trovano contano più di una: una può aver
    // cercato male, due vuol dire che quella fontanella non c'è più.
    if(sp>=2 && sp>ok) return {s:'missing', why:sp+' non l\'hanno trovata',
                               last:ag.last_missing||ag.last_report};
    if(lv>=1 && lv>=ko) return {s:'works', why:lv+(lv===1?' segnalazione':' segnalazioni'),
                                last:ag.last_works||ag.last_report};
    if(ko>=2 && ko>ok) return {s:'broken', why:ko+' segnalazioni', last:ag.last_report};
    if(ok>=1 && ok>=ko) return {s:'ok', why:ok+' conferme', last:ag.last_report};
    if(ko===1) return {s:'doubt', why:'1 segnalazione', last:ag.last_report};
  }
  if(ov && ov.status && ov.status!=='unknown') return {s:ov.status, why:'verificata'};
  if(p.tags.check_date) return {s:'unknown', why:'verificata su OSM il '+p.tags.check_date};
  return {s:'unknown', why:null};
}
function stateLabel(st){
  if(st.s==='ok')      return {c:'ok',   t:'Funzionante'};
  if(st.s==='broken')  return {c:'bad',  t:'Segnalata rotta'};
  if(st.s==='works')   return {c:'warn', t:'Lavori in corso'};
  if(st.s==='missing') return {c:'bad',  t:'Nessuno la trova'};
  if(st.s==='removed') return {c:'bad',  t:'Rimossa'};
  if(st.s==='doubt')   return {c:'warn', t:'Da verificare'};
  return {c:'', t:'Stato sconosciuto'};
}

function tagsFor(p){
  var t=p.tags, ov=p.ov||{}, out=[], st=stateOf(p), sl=stateLabel(st);
  out.push({c:sl.c, s:sl.t});
  if(t.drinking_water==='no' || ov.potable===false) out.push({c:'bad', s:'Non potabile'});
  else if(t.drinking_water==='yes' || t.amenity==='drinking_water' || ov.potable===true) out.push({c:'ok', s:'Potabile'});
  var fee = feeOf(p);
  if(fee==='paid') out.push({c:'warn', s:'A pagamento'});
  else if(fee==='free') out.push({c:'ok', s:'Gratis'});
  else out.push({c:'', s: p.kind==='casa' ? 'Di solito gratis' : 'Gratis, salvo sorprese'});
  if(ov.requires_card || p.kind==='casa') out.push({c:'warn', s:'Serve la tessera sanitaria'});
  if(t.bottle==='yes') out.push({c:'', s:'Riempi la borraccia'});
  if(t.wheelchair==='yes')     out.push({c:'ok',   s:'Accessibile in carrozzina'});
  if(t.wheelchair==='limited') out.push({c:'warn', s:'Accesso difficoltoso'});
  if(t.wheelchair==='no')      out.push({c:'bad',  s:'Non accessibile in carrozzina'});
  if(t.dog==='yes' || t.bowl==='yes' || t['drinking_water:dog']==='yes')
    out.push({c:'ok', s:'Ha la vaschetta per i cani'});
  if(t.seasonal==='yes') out.push({c:'warn', s:'Stagionale'});
  if(t.opening_hours) out.push({c:'', s:t.opening_hours});
  var r=reviewAgg[p.target];
  if(r && r.n){
    var m = mediaVera(r);
    if(m != null) out.push({c:'', s:'★ '+String(m).replace('.',',')+' ('+r.n+')'});
    var nt = nomeTemperatura(r.temperature);
    if(nt) out.push({c:'', s:nt.t});
  }
  return out;
}

/* ============================================================
   MAPPA
   ============================================================ */
function initMap(c){
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([c.lat,c.lon],16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('moveend', function(){
    var c2=map.getCenter();
    loadArea({lat:c2.lat, lon:c2.lng});
  });
}
function setMe(pos){
  myPos=pos;
  if(!meMarker){
    meMarker=L.marker([pos.lat,pos.lon],{
      icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),
      interactive:false,zIndexOffset:1000}).addTo(map);
  } else meMarker.setLatLng([pos.lat,pos.lon]);
}

/* ============================================================
   DATI: snapshot statico -> Overpass -> Supabase
   ============================================================ */
function tileKey(lat,lon){
  return (Math.floor(lat/TILE)*TILE).toFixed(1)+'_'+(Math.floor(lon/TILE)*TILE).toFixed(1);
}
function tilesForView(){
  var b=map.getBounds(), keys={}, out=[];
  for(var la=Math.floor(b.getSouth()/TILE)*TILE; la<=b.getNorth(); la+=TILE)
    for(var lo=Math.floor(b.getWest()/TILE)*TILE; lo<=b.getEast(); lo+=TILE){
      var k=tileKey(la,lo);
      if(!keys[k]){ keys[k]=1; out.push(k); }
    }
  return out;
}
function addPoints(arr){
  var added=0;
  arr.forEach(function(p){
    if(byId[p.id]) return;
    byId[p.id]=p; points.push(p); added++;
  });
  return added;
}
function loadArea(center){
  sfoltisci();
  var keys=tilesForView(), pending=[];
  keys.forEach(function(k){ if(!tilesLoaded[k]){ tilesLoaded[k]='loading'; pending.push(k); } });

  pending.forEach(function(k){
    fetch(CFG.DATA_BASE+'/'+k+'.json')
      .then(function(r){ if(!r.ok) throw new Error('404'); return r.json(); })
      .then(function(d){
        tilesLoaded[k]='ok';
        addPoints((d.p||[]).map(decodePoint));
        render();
      })
      .catch(function(){
        tilesLoaded[k]='miss';
        overpass(center);   // niente snapshot per quest'area: chiedo a Overpass
      });
  });

  if(!lastQ || dist(lastQ,center)>1200){ lastQ=center; loadSupabase(center); }

  // Se qui intorno non è comparso niente, insisto con Overpass invece di
  // lasciare la mappa muta. Al massimo una richiesta ogni 6 secondi.
  var vicini = points.filter(function(p){ return dist(center,p) < 2500; }).length;
  var passato = Date.now() - lastOverpassAt;
  var lontano = !lastOverpassAt_center || dist(lastOverpassAt_center, center) > 900;
  if(vicini === 0 && passato > 6000 && (lontano || passato > 20000)) overpass(center);
}

/* formato compatto dello snapshot: [osmid, lat, lon, kind, name, flags] */
function decodePoint(a){
  var kind = a[3]===1 ? 'casa' : 'fontanella';
  var tags = {};
  if(a[4]) tags.name=a[4];
  var f=a[5]||0;
  if(f&1) tags.drinking_water='yes';
  if(f&2) tags.drinking_water='no';
  if(f&4) tags.fee='yes';
  if(f&8) tags.fee='no';
  if(f&16) tags.bottle='yes';
  if(f&32) tags.seasonal='yes';
  if(f&64) tags.wheelchair='yes';
  if(f&128) tags.wheelchair='limited';
  if(f&256) tags.dog='yes';
  if(a[6]) tags.check_date=a[6];
  return {id:a[0], target:'osm/'+a[0], lat:a[1], lon:a[2], kind:kind, tags:tags};
}

function overpass(c){
  if(fetching) return;
  fetching=true;
  lastOverpassAt=Date.now(); lastOverpassAt_center=c;
  if(!firstLoadDone) toast('Cerco i punti d\'acqua qui intorno…', 2600);
  var a='(around:'+RADIUS+','+c.lat.toFixed(5)+','+c.lon.toFixed(5)+')';
  var q='[out:json][timeout:25];('+
    'nwr["amenity"="drinking_water"]'+a+';'+
    'nwr["man_made"="water_tap"]["drinking_water"!="no"]'+a+';'+
    'nwr["amenity"="water_point"]'+a+';'+
    'nwr["amenity"="vending_machine"]["vending"~"water"]'+a+';'+
    'nwr["natural"="spring"]["drinking_water"="yes"]'+a+';);out center tags 300;';
  fetch('https://overpass-api.de/api/interpreter',{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q)
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      fetching=false;
      var prima=points.length;
      addPoints((d.elements||[]).map(function(e){
        var lat=e.lat!=null?e.lat:(e.center&&e.center.lat);
        var lon=e.lon!=null?e.lon:(e.center&&e.center.lon);
        if(lat==null||lon==null) return null;
        var tags=e.tags||{};
        if(tags.access==='private'||tags.access==='no') return null;
        var id=e.type+'/'+e.id;
        return {id:id, target:'osm/'+id, lat:lat, lon:lon, tags:tags, kind:classify(tags)};
      }).filter(Boolean));
      render();
      var nuovi = points.length - prima;
      if(!firstLoadDone){
        firstLoadDone = true;
        if(!nuovi && !points.length)
          toast('Qui non risulta mappato nessun punto d\'acqua. Prova a spostarti o cerca un\'altra zona.', 5000);
      }
    })
    .catch(function(){
      fetching=false;
      // rete o limite di Overpass: riprovo una volta sola, tra otto secondi
      setTimeout(function(){
        if(!points.length){ lastOverpassAt=0; overpass(c); }
      }, 8000);
    });
}

function loadSupabase(c){
  if(!SB.on()) return;
  var d=0.06;
  SB.select('fountains?select=*&hidden=eq.false'
    +'&lat=gte.'+(c.lat-d)+'&lat=lte.'+(c.lat+d)
    +'&lon=gte.'+(c.lon-d)+'&lon=lte.'+(c.lon+d)+'&limit=1000')
    .then(function(rows){
      var custom=[];
      rows.forEach(function(r){
        if(r.osm_id){ overrides[r.osm_id]=r; }
        else {
          custom.push({id:'db/'+r.id, target:'db/'+r.id, lat:r.lat, lon:r.lon,
                       kind:r.kind, tags:{name:r.name}, ov:r, custom:true});
        }
      });
      addPoints(custom);
      points.forEach(function(p){ if(overrides[p.id]) p.ov=overrides[p.id]; });
      render();
    });
  SB.select('v_status?select=*&limit=5000').then(function(rows){
    rows.forEach(function(r){ statusAgg[r.target]=r; }); render();
  });
  SB.select('v_reviews?select=*&limit=5000').then(function(rows){
    rows.forEach(function(r){ reviewAgg[r.target]=r; }); render();
  });
}

/* ============================================================
   RENDER
   ============================================================ */
var IC_F='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3s7 8.4 7 12.6A7 7 0 0 1 5 15.6C5 11.4 12 3 12 3Z"/></svg>';
var IC_C='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#07242F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M10 20v-6h4v6"/></svg>';

function visible(){
  return points.filter(function(p){
    if(!show[p.kind]) return false;
    var st=stateOf(p);
    if(st.s==='removed') return false;
    if(show.okonly && (st.s==='broken' || st.s==='works' || st.s==='missing')) return false;
    if(show.freeonly && feeOf(p)==='paid') return false;
    if(show.access && p.tags.wheelchair!=='yes') return false;
    if(show.dog && !(p.tags.dog==='yes' || p.tags.bowl==='yes' || p.tags['drinking_water:dog']==='yes')) return false;
    return true;
  });
}
/* ============================================================
   DISEGNO DELLA MAPPA
   Con l'Italia intera i punti sono decine di migliaia: disegnarli
   tutti significa bloccare il telefono. Quindi si disegna solo
   quello che è davvero inquadrato, e da lontano si raggruppa.
   ============================================================ */
var ZOOM_SINGOLI = 15;   // sotto questo zoom si raggruppa
var MAX_PIN = 350;       // tetto di sicurezza, non si supera mai

function inVista(){
  var b = map.getBounds().pad(0.25);
  return visible().filter(function(p){
    return p.lat >= b.getSouth() && p.lat <= b.getNorth() &&
           p.lon >= b.getWest()  && p.lon <= b.getEast();
  });
}

function raggruppa(punti, zoom){
  // Una griglia grossolana: più si è lontani, più larghe le celle.
  var passo = 360 / Math.pow(2, zoom + 3);
  var celle = {};
  punti.forEach(function(p){
    var k = Math.floor(p.lat/passo) + ':' + Math.floor(p.lon/passo);
    var c = celle[k] || (celle[k] = {n:0, lat:0, lon:0, uno:null});
    c.n++; c.lat += p.lat; c.lon += p.lon; c.uno = p;
  });
  return Object.keys(celle).map(function(k){
    var c = celle[k];
    c.lat /= c.n; c.lon /= c.n;
    return c;
  });
}

function disegnaPin(p){
  var casa = p.kind === 'casa', st = stateOf(p);
  var guasto = (st.s === 'broken' || st.s === 'missing');
  L.marker([p.lat, p.lon], {icon: L.divIcon({className:'',
    html:'<div class="pin'+(casa?' casa':'')+(guasto?' broken':'')+
         (selected && selected.target === p.target ? ' sel' : '')+'">'+
         (casa?IC_C:IC_F)+
         (feeOf(p)==='paid'?'<span class="fee">€</span>':'')+'</div>',
    iconSize:[30,30], iconAnchor:[15,28]})})
   .on('click', function(){ openSheet(p); }).addTo(layer);
}

function render(){
  if(!layer) return;
  layer.clearLayers();

  var zoom = map.getZoom();
  var punti = inVista();

  if(zoom < ZOOM_SINGOLI && punti.length > 60){
    raggruppa(punti, zoom).forEach(function(c){
      if(c.n === 1){ disegnaPin(c.uno); return; }
      var grande = c.n > 99;
      L.marker([c.lat, c.lon], {icon: L.divIcon({className:'',
        html:'<div class="grappolo'+(grande?' grande':'')+'">'+(c.n>999?'999+':c.n)+'</div>',
        iconSize:[grande?46:38, grande?46:38], iconAnchor:[grande?23:19, grande?23:19]})})
       .on('click', function(){
          map.setView([c.lat, c.lon], Math.min(19, zoom + 3), {animate:true});
       }).addTo(layer);
    });
  } else {
    punti.slice(0, MAX_PIN).forEach(disegnaPin);
  }

  // il punto aperto resta visibile anche se finisce fuori inquadratura
  if(selected && punti.indexOf(selected) === -1) disegnaPin(selected);
  if(!selected) showNearest();
}

/* La memoria non è infinita: oltre una certa soglia si tengono solo
   i punti più vicini, tanto gli altri si ricaricano quando servono. */
function sfoltisci(){
  if(points.length < 6000) return;
  var c = map.getCenter(), centro = {lat:c.lat, lon:c.lng};
  points.sort(function(a,b){ return dist(centro,a) - dist(centro,b); });
  points.splice(4000).forEach(function(p){
    if(selected && selected.target === p.target){ points.push(p); return; }
    delete byId[p.id];
  });
}
function nearest(){
  if(!myPos) return null;
  var best=null,bd=Infinity;
  visible().forEach(function(p){
    if(p.tags.drinking_water==='no') return;
    var sq=stateOf(p).s;
    if(sq==='broken' || sq==='works' || sq==='missing') return;
    var d=dist(myPos,p); if(d<bd){bd=d;best=p;}
  });
  return best?{p:best,d:bd}:null;
}
function showNearest(){
  var n=nearest();
  if(!n){ hideCard(); return; }
  fillCard(n.p, n.d, true);
}
function hideCard(){
  document.getElementById('card').classList.add('hidden');
  document.body.classList.add('card-hidden');
}
function fillCard(p,d,isNearest){

  var sub=[]; if(isNearest) sub.push(labelFor(p));

  document.getElementById('cSub').textContent=sub.join(' · ');

      '<button data-m="auto"'+(modo==='auto'?' class="on"':'')+'>In auto</button></div>'+
    '<div style="display:flex;gap:8px;width:100%;margin-top:11px">'+

  return 'https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lon+'&travelmode='+M.g;

var STARS=[['findability','Facile da raggiungere'],
           ['cleanliness','Stato della fontana'],
           ['taste',"Qualità dell'acqua"]];

/* La temperatura non è un voto: è una descrizione. Tre scelte, non cinque
   stelle, perché "tre stelle di temperatura" non vuol dire niente.
   Sotto resta un numero (1/3/5) solo perché è così che sta nel database. */
var TEMPI = [[1,'Calda'],[3,'Ambiente'],[5,'Fresca']];
function nomeTemperatura(media){
  if(media == null) return null;
  if(media < 2.34) return {c:'calda',    t: media < 1.5 ? 'Calda' : 'Perlopiù calda'};
  if(media < 3.67) return {c:'ambiente', t:'Temperatura ambiente'};
  return {c:'fresca', t: media > 4.5 ? 'Fresca' : 'Perlopiù fresca'};
}
/* Il voto complessivo tiene conto solo dei tre giudizi veri. */
function mediaVera(r){
  var v = [r.findability, r.cleanliness, r.taste].filter(function(x){ return x != null; });
  if(!v.length) return null;
  return Math.round(v.reduce(function(a,b){ return a + (+b); }, 0) / v.length * 10) / 10;
}

function starSvg(){ return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>'; }

var myRating={};
function renderMyStars(){

  var w=document.getElementById('myStars'); w.innerHTML=h;

  var seg=document.getElementById('tempSeg');
  seg.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){
      var v=+b.getAttribute('data-v');
      // ritoccando la stessa scelta la si annulla
      if(myRating.temperature===v){ delete myRating.temperature; b.classList.remove('on'); return; }
      myRating.temperature=v;
      seg.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
    };
  });
  w.querySelectorAll('.stars').forEach(function(row){
    row.querySelectorAll('.star').forEach(function(b){
      b.onclick=function(){
        var k=row.getAttribute('data-k'), v=+b.getAttribute('data-v');

function sendReport(p,status){

function sendReview(p){
  if(needSB()) return;
  var keys=Object.keys(myRating);
  if(!keys.length){ toast('Tocca almeno una stella prima di inviare.'); return; }
  var row={target:p.target,client_id:CLIENT,
    comment:(document.getElementById('revComment').value||'').trim()||null};
  STARS.forEach(function(s){ row[s[0]]=myRating[s[0]]||null; });
  row.temperature = myRating.temperature || null;
  // tutto è facoltativo: si può mandare anche una sola voce
  var b=document.getElementById('revSend'); b.disabled=true; b.textContent='Invio…';

  function riuscito(){

  }
  function fallito(err){
    b.disabled=false; b.textContent='Invia il voto';
    toast('Non è partita: '+(err && err.message ? err.message : 'riprova').slice(0,120), 6000);
  }

  SB.insert('reviews', row)
    .then(riuscito)
    .catch(function(err){
      var m = (err && err.message ? err.message : '').toLowerCase();
      // Se il database non conosce ancora la colonna temperature (schema
      // appena modificato e cache non ricaricata), rimando il voto senza
      // quella stella invece di far perdere tutto all'utente.
      if(m.indexOf('temperature') > -1 || m.indexOf('column') > -1 || m.indexOf('pgrst204') > -1){
        var ridotta = {};
        Object.keys(row).forEach(function(k){ if(k!=='temperature') ridotta[k]=row[k]; });
        return SB.insert('reviews', ridotta).then(riuscito).catch(fallito);
      }
      fallito(err);
    });
}
function shrink(file,maxPx,q){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,maxPx/Math.max(img.width,img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?res(b):rej(new Error('canvas')); },'image/jpeg',q);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src=url;
  });
}
function sendPhoto(p,file){
  if(!file) return;
  if(needSB()) return;
  toast('Carico la foto…',6000);
  shrink(file,1280,.75).then(function(blob){
    var name=Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
    return SB.upload(blob,name).then(function(url){
      return SB.insert('photos',{target:p.target,path:name,url:url,client_id:CLIENT});
    });
  }).then(function(){
    toast('Foto inviata. La vedrai online dopo il controllo.',4200);
  }).catch(function(err){
    toast('Foto non caricata: '+(err && err.message ? err.message : 'riprova').slice(0,120), 6000);
  });
}

   Il link porta chi lo riceve esattamente su questo punto,
   non sulla sua posizione.
   ============================================================ */
function linkDi(p){
  var base = location.origin + location.pathname;
  return base + '?f=' + encodeURIComponent(p.target);
}
function condividi(p){
  var url = linkDi(p);
  var titolo = labelFor(p);
  var testo = 'Acqua potabile: ' + titolo;
  if(navigator.share){
    navigator.share({title:'IDRATATI', text:testo, url:url}).catch(function(){});
    return;
  }
  if(navigator.clipboard){
    navigator.clipboard.writeText(url)
      .then(function(){ toast('Link copiato. Incollalo dove vuoi.', 3600); })
      .catch(function(){ toast(url, 8000); });
  } else {
    toast(url, 8000);
  }
}

/* Se si arriva da un link condiviso, si apre subito quella fontanella. */
function apriDaLink(){
  var m = location.search.match(/[?&]f=([^&]+)/);
  if(!m) return;
  var target = decodeURIComponent(m[1]);

  function prova(tentativi){
    var p = points.filter(function(x){ return x.target === target; })[0];
    if(p){
      map.setView([p.lat, p.lon], 17, {animate:false});
      openSheet(p);
      return;
    }
    if(tentativi <= 0){ recuperaDaOsm(target); return; }
    setTimeout(function(){ prova(tentativi - 1); }, 700);
  }
  prova(5);
}

/* Il punto non è tra quelli caricati: lo chiedo direttamente a
   OpenStreetMap, così il link funziona anche da dall'altra parte d'Italia. */
function recuperaDaOsm(target){
  if(target.indexOf('osm/node/') !== 0){
    // punto nostro: sta su Supabase
    if(target.indexOf('db/') === 0 && SB.on()){
      SB.select('fountains?select=*&id=eq.'+target.slice(3)).then(function(rows){
        if(!rows.length) return;
        var r = rows[0];
        var p = {id:'db/'+r.id, target:'db/'+r.id, lat:r.lat, lon:r.lon,
                 kind:r.kind, tags:{name:r.name}, ov:r, custom:true};
        addPoints([p]); map.setView([p.lat,p.lon],17); render(); openSheet(p);
      });
    }
    return;
  }
  fetch('https://api.openstreetmap.org/api/0.6/node/'+target.slice(9)+'.json')
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      var e = (d.elements||[])[0];
      if(!e) throw new Error('vuoto');
      var tags = e.tags || {};
      var p = {id:'node/'+e.id, target:target, lat:e.lat, lon:e.lon,
               tags:tags, kind:classify(tags)};
      addPoints([p]);
      map.setView([p.lat, p.lon], 17);
      render();
      openSheet(p);
    })
    .catch(function(){ toast('Non trovo la fontanella di quel link.', 4200); });
}

function registraQui(lat, lon){
  if(needSB()) return;

  if(myPos && dist(myPos, {lat:lat, lon:lon}) < 25){
    lat = myPos.lat; lon = myPos.lon; preciso = true;
  }

                : 'Segnaposto piantato qui.', 2600);

/* Il gesto ha due tempi.
   Primi sette decimi di secondo: silenzio. Chi trascina la mappa si muove
   entro quel tempo, quindi non vede né sente niente e non fa partire nulla.
   Poi la cornice comincia a chiudersi, e da lì la mano può ballare
   parecchio senza che il conto alla rovescia si interrompa. */
var RITARDO       = 700;    // il tempo che serve a capire che non stai trascinando
var DURATA        = 1300;   // poi il conto alla rovescia della cornice
var TOLL_ATTESA   = 20;     // pixel concessi nella fase silenziosa
var TOLL_CORNICE  = 80;     // pixel concessi una volta partito

function attivaPressioneLunga(){
  var el = map.getContainer(), cornice = document.getElementById('lpfull');
  var attesa = null, conto = null, battiti = [];
  var sx = 0, sy = 0, punto = null, fase = null;

  function ferma(){
    if(attesa){ clearTimeout(attesa); attesa = null; }
    if(conto){  clearTimeout(conto);  conto  = null; }
    battiti.forEach(clearTimeout); battiti = [];
    fase = null;
    vibra(0);
    cornice.classList.remove('on');
  }

  function avvia(x, y){
    if(adding) return;
    ferma();
    sx = x; sy = y; fase = 'attesa';
    var r = el.getBoundingClientRect();
    // Il punto si prende adesso: se poi la mappa scorre un po' sotto il dito,
    // la fontanella indicata resta quella che stavi toccando.
    punto = map.containerPointToLatLng(L.point(x - r.left, y - r.top));

    attesa = setTimeout(function(){
      fase = 'cornice';
      void cornice.offsetWidth;          // riavvio pulito delle animazioni
      cornice.classList.add('on');

      var scala = [440, 554, 659, 880];  // un tocco per ogni lato, sempre più acuto
      tick(scala[0], 0.10);
      battiti = [1,2,3].map(function(i){
        return setTimeout(function(){ tick(scala[i], 0.10 + i*0.02); }, i * 325);
      });
      vibra([10, 315, 14, 311, 18, 307, 22]);

      conto = setTimeout(function(){
        ferma();
        vibra(45);
        suonoGoccia();
        registraQui(punto.lat, punto.lng);
      }, DURATA);
    }, RITARDO);
  }

  function muovi(x, y){
    if(!fase) return;
    var limite = (fase === 'attesa') ? TOLL_ATTESA : TOLL_CORNICE;
    if(Math.abs(x - sx) > limite || Math.abs(y - sy) > limite) ferma();
  }

  el.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1){ ferma(); return; }
    avvia(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  el.addEventListener('touchmove', function(e){
    if(e.touches.length !== 1){ ferma(); return; }
    muovi(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  el.addEventListener('touchend',    ferma, {passive:true});
  el.addEventListener('touchcancel', ferma, {passive:true});

  // stesso gesto col mouse, per chi prova da computer
  el.addEventListener('mousedown', function(e){
    if(e.button === 0) avvia(e.clientX, e.clientY);
  });
  el.addEventListener('mousemove', function(e){ muovi(e.clientX, e.clientY); });
  el.addEventListener('mouseup',    ferma);
  el.addEventListener('mouseleave', ferma);
  // Lo zoom è sempre un'altra intenzione; il semplice scorrimento invece
  // lo lascio gestire alla tolleranza qui sopra.
  map.on('zoomstart', ferma);
}

  navigator.geolocation.getCurrentPosition(function(pos){
    var p={lat:pos.coords.latitude, lon:pos.coords.longitude};

    if(recenter) map.setView([p.lat,p.lon],16);
    loadArea(p); render();

    toast('Posizione non attiva. Cerca la città qui sopra.',4500);
    var c=map.getCenter(); loadArea({lat:c.lat,lon:c.lng});
  },{enableHighAccuracy:true,timeout:9000,maximumAge:30000});

function watchPosition(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(function(pos){
    setMe({lat:pos.coords.latitude, lon:pos.coords.longitude});
    if(!selected) showNearest();
  },function(){},{enableHighAccuracy:true,maximumAge:15000,timeout:20000});
}

/* ---------- l'accento che cambia il significato del nome ----------
   IDRÀTATI è un ordine. IDRATÀTI è come dovresti stare.            */
function accentoInMovimento(){
  var wm=document.getElementById('wm'), acc=document.getElementById('acc');
  if(!wm||!acc) return;
  var a1=wm.querySelector('.a1'), a2=wm.querySelector('.a2');
  function centro(el){ return el.offsetLeft + (el.offsetWidth - acc.offsetWidth)/2; }
  var fermo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function posiziona(){
    if(!a1.offsetWidth) return;                       // il font non è ancora pronto
    acc.style.left = centro(fermo ? a2 : a1)+'px';
    acc.style.opacity = 1;
    if(!fermo) setTimeout(function(){ acc.style.left = centro(a2)+'px'; }, 900);
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(posiziona, posiziona);
  setTimeout(posiziona, 260);
}
accentoInMovimento();

/* ============================================================
   INSTALLAZIONE
   Android sa proporsi da solo, e allora gli diamo un bottone vero.
   iPhone non lo permette, quindi lì si spiega il gesto a parole:
   nessuno lo indovina da sé.
   ============================================================ */
(function(){
  var invito = null;
  var box = document.getElementById('installa');
  if(!box) return;

  var giaApp = window.matchMedia('(display-mode: standalone)').matches ||
               window.navigator.standalone === true;
  var iOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var safari = iOS && !/crios|fxios|edgios/i.test(navigator.userAgent);

  function nascondi(perSempre){
    box.classList.remove('on');
    if(perSempre) store.set('idr_no_installa','1');
  }
  document.getElementById('instNo').onclick = function(){ nascondi(true); };

  function mostra(){
    if(giaApp || store.get('idr_no_installa') === '1') return;
    box.classList.add('on');
  }

  // Android e desktop: il browser ci avvisa che si può installare
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    invito = e;
    document.getElementById('instSub').textContent =
      'Diventa un\'icona sulla schermata, si apre a tutto schermo e funziona anche con poca rete.';
    document.getElementById('instPassi').textContent = '';
    var si = document.getElementById('instSi');
    si.hidden = false;
    si.onclick = function(){
      nascondi(true);
      invito.prompt();
      invito.userChoice.then(function(){ invito = null; });
    };
    setTimeout(mostra, 9000);
  });

  window.addEventListener('appinstalled', function(){ nascondi(true); });

  // iPhone: niente invito automatico, si spiega il gesto
  if(safari && !giaApp){
    document.getElementById('instSub').textContent =
      'Su iPhone si aggiunge a mano, sono due tocchi.';
    document.getElementById('instPassi').innerHTML =
      'Tocca <b>Condividi</b> in fondo allo schermo<br>' +
      'poi <b>Aggiungi alla schermata Home</b>';
    setTimeout(mostra, 12000);
  }
})();
