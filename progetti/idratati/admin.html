<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- IDRATATI pannello v2.5 (2026-07-27) -->
<title>IDRATATI — pannello v2.5</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#07242F">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07242F; --surface:#F2F7F6; --card:#fff;
  --acqua:#00A6A6; --acqua-deep:#00807F; --getto:#FFB020; --rotta:#E5484D;
  --muted:rgba(7,36,47,.58); --line:rgba(7,36,47,.12);
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Inter Tight',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--body);background:var(--surface);color:var(--ink);
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acqua);outline-offset:2px}

header{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--surface);
  padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--display);font-weight:800;letter-spacing:.13em;font-size:13px}
.badge{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--acqua);
  color:#04222c;padding:4px 8px;border-radius:6px;font-weight:600}
header .sp{margin-left:auto;font-size:12px;color:rgba(242,247,246,.6)}
#logout{background:rgba(255,255,255,.12);color:var(--surface);border:none;padding:8px 11px;
  border-radius:9px;font-size:12.5px;font-weight:600}

nav{position:sticky;top:52px;z-index:40;background:var(--surface);display:flex;gap:6px;
  padding:10px 12px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:none;background:rgba(7,36,47,.06);color:var(--ink);
  padding:9px 13px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--surface)}
nav button .n{background:var(--rotta);color:#fff;border-radius:999px;padding:1px 6px;
  font-size:10.5px;margin-left:5px}

main{padding:14px 12px 60px;max-width:820px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:11px;
  box-shadow:0 2px 10px rgba(7,36,47,.06)}
.card h3{font-family:var(--display);font-weight:600;font-size:17px;margin:0 0 3px}
.meta{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.btn{border:none;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600;
  background:var(--ink);color:var(--surface)}
.btn.ok{background:var(--acqua);color:#fff}
.btn.bad{background:rgba(229,72,77,.12);color:var(--rotta)}
.btn.ghost{background:rgba(7,36,47,.07);color:var(--ink)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.minimappa{width:100%;height:190px;border:none;border-radius:12px;margin-top:11px;
  background:rgba(7,36,47,.05);display:block}
.dett{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dett summary{padding:11px 13px;font-size:13px;font-weight:600;cursor:pointer;
  background:rgba(7,36,47,.035);list-style:none}
.dett summary::-webkit-details-marker{display:none}
.dett summary::after{content:'▾';float:right;opacity:.5}
.dett[open] summary::after{content:'▴'}
.dett .corpo{padding:4px 13px 12px}
.riga{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.riga:last-child{border-bottom:none}
.riga .q{color:var(--muted);flex:0 0 auto}
.riga .v{text-align:right;font-weight:500}
.vuoto{font-size:13px;color:var(--muted);padding:10px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;
  background:rgba(7,36,47,.07);color:var(--muted);margin-right:5px}
.pills .pill{margin-right:0}
.pill b{font-weight:700;color:var(--ink)}
.pill.ok{background:rgba(0,166,166,.14);color:var(--acqua-deep)}
.pill.bad{background:rgba(229,72,77,.13);color:var(--rotta)}
.pill.warn{background:rgba(255,176,32,.2);color:#8A5B00}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:11px 0 5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  font-family:var(--body);font-size:14px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:13.5px}
.check input{width:auto}
img.thumb{width:100%;max-height:230px;object-fit:cover;border-radius:12px;margin-top:10px;display:block}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:32px 12px}
#map{height:56vh;min-height:330px;border-radius:16px;margin-bottom:11px}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border:none}
.stat b{font-family:var(--display);font-size:17px}

/* login */
#login{max-width:340px;margin:14vh auto;padding:0 18px}
#login .card{padding:20px}
#login h1{font-family:var(--display);font-weight:800;letter-spacing:.13em;font-size:19px;margin:0 0 4px}
#err{color:var(--rotta);font-size:13px;margin-top:10px;display:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);z-index:900;
  background:var(--ink);color:var(--surface);font-size:13px;padding:11px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);
  background:var(--acqua);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pin.casa{background:var(--getto);border-radius:8px;transform:rotate(0)}
.pin.broken{background:var(--rotta)}
.pin.custom{border-color:#07242F}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h1>IDRATATI</h1>
    <div class="meta">Pannello riservato · v2.5</div>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" inputmode="email">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="btn ok" id="go" style="flex:1">Entra</button></div>
    <div id="err"></div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <span class="logo">IDRATATI</span><span class="badge">admin</span><span class="badge" style="background:rgba(255,255,255,.16);color:var(--surface)">v2.5</span>
    <span class="sp" id="who"></span>
    <button id="logout">Esci</button>
  </header>
  <nav>
    <button data-t="queue" class="on">Proposte <span class="n" id="nQueue" hidden></span></button>
    <button data-t="photos">Foto <span class="n" id="nPhotos" hidden></span></button>
    <button data-t="reports">Segnalazioni</button>
    <button data-t="reviews">Recensioni</button>
    <button data-t="map">Mappa e modifiche</button>
    <button data-t="stats">Numeri</button>
  </nav>
  <main id="view"></main>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
'use strict';

/* ===== CONFIG: identici a quelli di index.html ===== */
var CFG = {
  SUPABASE_URL: 'https://usaagxlsqmxbcagiwnoz.supabase.co',
  // INCOLLA QUI SOTTO la chiave anon public (Supabase > Project Settings > API)
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzYWFneGxzcW14YmNhZ2l3bm96Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDU4NjYsImV4cCI6MjEwMDcyMTg2Nn0.IijyrG7pPtn-9E168xVeVIX8mdHUAWDEOHTq998wFHA'
};

var TOKEN=null, USER=null, tab='queue', map=null, layer=null, editing=null;

function el(id){ return document.getElementById(id); }
function toast(m,ms){ var t=el('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');}, ms||3000); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ago(iso){
  if(!iso) return '';
  var d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
  if(d<1) return 'oggi'; if(d===1) return 'ieri';
  if(d<30) return d+' giorni fa'; if(d<365) return Math.round(d/30)+' mesi fa';
  return 'oltre un anno fa';
}
function photoUrl(path){
  return CFG.SUPABASE_URL+'/storage/v1/object/public/photos/'+path;
}

/* ============================================================
   CONTESTO
   Un target è una stringa come 'osm/node/4953163133'. Da sola non
   dice niente. Qui la si trasforma in: nome, tipo, coordinate,
   indirizzo vero, stato attuale e foto già pubblicate.
   ============================================================ */
var CTX = {};          // target -> dati
var INDIRIZZI = {};    // "lat,lon" -> via
var codaVie = [], viaInCorso = false;

function ctxVuoto(t){
  return {target:t, nome:null, tipo:null, lat:null, lon:null,
          via:null, stato:null, voti:null, foto:[]};
}

/* Nominatim vuole al massimo una richiesta al secondo: le metto in coda. */
function chiediVia(lat, lon, quando){
  var k = lat.toFixed(5)+','+lon.toFixed(5);
  if(INDIRIZZI[k]){ quando(INDIRIZZI[k]); return; }
  codaVie.push({k:k, lat:lat, lon:lon, cb:quando});
  smaltisciCoda();
}
function smaltisciCoda(){
  if(viaInCorso || !codaVie.length) return;
  viaInCorso = true;
  var job = codaVie.shift();
  fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat='+
        job.lat+'&lon='+job.lon)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var a = d.address || {};
      var via = [a.road || a.pedestrian || a.footway || a.square || a.park,
                 a.house_number].filter(Boolean).join(' ');
      var zona = a.suburb || a.city_district || a.neighbourhood;
      var citta = a.city || a.town || a.village;
      var testo = [via, zona, citta].filter(Boolean).join(', ') || d.display_name || null;
      INDIRIZZI[job.k] = testo;
      job.cb(testo);
    })
    .catch(function(){ job.cb(null); })
    .then(function(){
      viaInCorso = false;
      setTimeout(smaltisciCoda, 1100);
    });
}

/* Raccoglie tutto il sapibile su una lista di target. */
function caricaContesti(targets){
  var unici = targets.filter(function(t,i){ return t && targets.indexOf(t)===i; });
  var daFare = unici.filter(function(t){ return !CTX[t]; });
  if(!daFare.length) return Promise.resolve(CTX);

  daFare.forEach(function(t){ CTX[t] = ctxVuoto(t); });

  var idsOsm = daFare.filter(function(t){ return t.indexOf('osm/')===0; })
                     .map(function(t){ return t.slice(4); });
  var idsDb  = daFare.filter(function(t){ return t.indexOf('db/')===0; })
                     .map(function(t){ return t.slice(3); });

  var lavori = [];

  // 1. i punti nostri, o le modifiche fatte da noi su punti OSM
  var filtro = [];
  if(idsDb.length)  filtro.push('id.in.('+idsDb.join(',')+')');
  if(idsOsm.length) filtro.push('osm_id.in.('+idsOsm.map(encodeURIComponent).join(',')+')');
  if(filtro.length){
    lavori.push(sel('fountains?select=*&or=('+filtro.join(',')+')').then(function(rows){
      rows.forEach(function(r){
        var t = r.osm_id ? 'osm/'+r.osm_id : 'db/'+r.id;
        if(!CTX[t]) return;
        CTX[t].nome  = r.name || CTX[t].nome;
        CTX[t].tipo  = r.kind;
        CTX[t].lat   = r.lat; CTX[t].lon = r.lon;
        CTX[t].stato = r.status;
        CTX[t].note  = r.notes;
      });
    }));
  }

  // 2a. l'API ufficiale di OpenStreetMap: è fatta apposta per cercare per id,
  //     risponde sempre e non ha code, al contrario di Overpass.
  var soloNodi = idsOsm.filter(function(x){ return x.indexOf('node/')===0; })
                       .map(function(x){ return x.split('/')[1]; });
  if(soloNodi.length){
    lavori.push(
      fetch('https://api.openstreetmap.org/api/0.6/nodes.json?nodes='+soloNodi.join(','))
        .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(d){
          (d.elements||[]).forEach(function(e){
            var t = 'osm/node/'+e.id, c = CTX[t];
            if(!c) return;
            var tg = e.tags || {};
            c.lat = e.lat; c.lon = e.lon;
            c.tags = tg;
            c.nome = c.nome || tg.name || null;
            c.tipo = c.tipo ||
              ((tg.amenity==='vending_machine'||tg.amenity==='water_point') ? 'casa' : 'fontanella');
          });
        })
        .catch(function(){ /* riproverà Overpass qui sotto */ })
    );
  }

  // 2b. Overpass per way e relation, e come rete di sicurezza per i nodi
  if(idsOsm.length){
    var perTipo = {node:[], way:[], relation:[]};
    idsOsm.forEach(function(x){
      var pezzi = x.split('/');
      if(perTipo[pezzi[0]]) perTipo[pezzi[0]].push(pezzi[1]);
    });
    var q = '[out:json][timeout:25];(' +
      (perTipo.node.length     ? 'node(id:'+perTipo.node.join(',')+');'         : '') +
      (perTipo.way.length      ? 'way(id:'+perTipo.way.join(',')+');'           : '') +
      (perTipo.relation.length ? 'relation(id:'+perTipo.relation.join(',')+');' : '') +
      ');out center tags;';
    lavori.push(
      fetch('https://overpass-api.de/api/interpreter',{method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'data='+encodeURIComponent(q)})
        .then(function(r){ return r.json(); })
        .then(function(d){
          (d.elements||[]).forEach(function(e){
            var t = 'osm/'+e.type+'/'+e.id;
            if(!CTX[t]) return;
            var tg = e.tags||{};
            CTX[t].nome = CTX[t].nome || tg.name || null;
            CTX[t].tags = tg;
            CTX[t].tipo = CTX[t].tipo ||
              ((tg.amenity==='vending_machine'||tg.amenity==='water_point') ? 'casa' : 'fontanella');
            if(CTX[t].lat==null){
              CTX[t].lat = e.lat!=null ? e.lat : (e.center&&e.center.lat);
              CTX[t].lon = e.lon!=null ? e.lon : (e.center&&e.center.lon);
            }
          });
        }).catch(function(){})
    );
  }

  // 3. come sta messa adesso, secondo chi è passato di lì
  lavori.push(sel('v_status?select=*&target=in.('+
      unici.map(function(t){ return '"'+t+'"'; }).join(',')+')')
    .then(function(rows){
      rows.forEach(function(r){ if(CTX[r.target]) CTX[r.target].voti = r; });
    }).catch(function(){}));

  // 3b. i voti con le stelle
  lavori.push(sel('v_reviews?select=*&target=in.('+
      unici.map(function(t){ return '"'+t+'"'; }).join(',')+')')
    .then(function(rows){
      rows.forEach(function(r){ if(CTX[r.target]) CTX[r.target].stelle = r; });
    }).catch(function(){}));

  // 3c. le singole segnalazioni e i singoli voti, per poterli leggere qui
  var listaTarget = unici.map(function(t){ return '"'+t+'"'; }).join(',');
  lavori.push(sel('reports?select=*&order=created_at.desc&limit=200&target=in.('+listaTarget+')')
    .then(function(rows){
      rows.forEach(function(r){
        if(!CTX[r.target]) return;
        (CTX[r.target].segnalazioni = CTX[r.target].segnalazioni || []).push(r);
      });
    }).catch(function(){}));
  lavori.push(sel('reviews?select=*&order=created_at.desc&limit=200&target=in.('+listaTarget+')')
    .then(function(rows){
      rows.forEach(function(r){
        if(!CTX[r.target]) return;
        (CTX[r.target].voti_singoli = CTX[r.target].voti_singoli || []).push(r);
      });
    }).catch(function(){}));

  // 4. le foto già pubblicate, per confronto
  lavori.push(sel('photos?select=target,url&approved=eq.true&target=in.('+
      unici.map(function(t){ return '"'+t+'"'; }).join(',')+')&limit=60')
    .then(function(rows){
      rows.forEach(function(r){ if(CTX[r.target]) CTX[r.target].foto.push(r.url); });
    }).catch(function(){}));

  return Promise.all(lavori).then(function(){ return CTX; });
}

/* Quanto ha già mandato questo dispositivo: serve a fiutare gli spammer. */
function pesaDispositivo(clientId){
  if(!clientId) return Promise.resolve(null);
  return Promise.all([
    sel('photos?select=id&client_id=eq.'+encodeURIComponent(clientId)),
    sel('reviews?select=id&client_id=eq.'+encodeURIComponent(clientId)),
    sel('submissions?select=id&client_id=eq.'+encodeURIComponent(clientId))
  ]).then(function(r){
    return {foto:r[0].length, voti:r[1].length, proposte:r[2].length};
  }).catch(function(){ return null; });
}

/* L'intestazione comune a foto, voti e proposte. */
function intestazione(c, idBlocco){
  if(!c) return '';
  var t = c.tags || {};
  var titolo = c.nome || (c.tipo==='casa' ? "Casa dell'acqua" : 'Fontanella pubblica');
  var h = '<h3>'+esc(titolo)+'</h3>';

  // indirizzo, e sotto sempre le coordinate: se il geocoder tace, le coordinate restano
  h += '<div class="meta" id="via-'+idBlocco+'">'+
       (c.via ? esc(c.via) : 'cerco l\'indirizzo…')+'</div>';
  if(c.lat != null)
    h += '<div class="meta" style="opacity:.7">'+c.lat.toFixed(6)+', '+c.lon.toFixed(6)+'</div>';

  var pills = [];
  pills.push('<span class="pill">'+(c.tipo==='casa' ? "casa dell'acqua" : 'fontanella')+'</span>');

  if(c.stato && c.stato!=='unknown'){
    var cl={ok:'ok',works:'warn',broken:'bad',removed:'bad'}[c.stato]||'';
    var tx={ok:'funzionante',works:'lavori in corso',broken:'rotta',removed:'rimossa'}[c.stato];
    pills.push('<span class="pill '+cl+'">'+tx+' (deciso da te)</span>');
  }
  if(c.voti){
    if(c.voti.ok_votes)
      pills.push('<span class="pill ok"><b>'+c.voti.ok_votes+'</b> dicono che funziona</span>');
    if(c.voti.works_votes)
      pills.push('<span class="pill warn"><b>'+c.voti.works_votes+'</b> segnalano lavori</span>');
    if(c.voti.broken_votes)
      pills.push('<span class="pill bad"><b>'+c.voti.broken_votes+'</b> dicono che è rotta</span>');
    if(c.voti.last_report)
      pills.push('<span class="pill">ultima segnalazione '+esc(ago(c.voti.last_report))+'</span>');
  }
  if(!c.voti && !c.stato) pills.push('<span class="pill">nessuno l\'ha ancora segnalata</span>');

  // quello che dice OpenStreetMap
  if(t.drinking_water==='no')                            pills.push('<span class="pill bad">non potabile</span>');
  else if(t.drinking_water==='yes'||t.amenity==='drinking_water') pills.push('<span class="pill ok">potabile</span>');
  if(t.fee==='yes')  pills.push('<span class="pill warn">a pagamento</span>');
  if(t.fee==='no')   pills.push('<span class="pill ok">gratis</span>');
  if(t.seasonal==='yes') pills.push('<span class="pill warn">stagionale</span>');
  if(t.opening_hours) pills.push('<span class="pill">'+esc(t.opening_hours)+'</span>');
  if(t.operator)      pills.push('<span class="pill">gestita da '+esc(t.operator)+'</span>');
  if(t.check_date)    pills.push('<span class="pill">verificata su OSM il '+esc(t.check_date)+'</span>');
  h += '<div class="pills">'+pills.join('')+'</div>';

  // le stelle già raccolte
  if(c.stelle && c.stelle.n){
    var st = c.stelle, voci = [];
    if(st.findability!=null) voci.push('raggiungibile '+st.findability+'★');
    if(st.cleanliness!=null) voci.push('stato '+st.cleanliness+'★');
    if(st.taste!=null)       voci.push('qualità '+st.taste+'★');
    if(st.temperature!=null){
      var nomi = st.temperature<2.34 ? 'calda' : (st.temperature<3.67 ? 'ambiente' : 'fresca');
      voci.push('acqua '+nomi);
    }
    h += '<div class="meta" style="color:var(--ink)">Giudizi già raccolti ('+st.n+'): '+
         esc(voci.join(' · '))+'</div>';
  }

  if(c.note) h += '<div class="meta" style="color:var(--ink);margin-top:6px">Nota tua: '+esc(c.note)+'</div>';

  // la mappa qui dentro, così non devi aprire niente altrove
  if(c.lat != null){
    var d = 0.0016;
    var bbox = (c.lon-d)+','+(c.lat-d)+','+(c.lon+d)+','+(c.lat+d);
    h += '<iframe class="minimappa" loading="lazy" title="Dov\'è" '+
         'src="https://www.openstreetmap.org/export/embed.html?bbox='+bbox+
         '&layer=mapnik&marker='+c.lat+','+c.lon+'"></iframe>';
  }

  h += '<div class="row" style="margin-top:10px">';
  if(c.lat != null){
    h += '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+c.lat+','+c.lon+'">Guarda in Street View</a>';
  }
  if(c.target.indexOf('osm/')===0)
    h += '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/'+esc(c.target.slice(4))+'">Scheda OSM</a>';
  h += '<button class="btn ghost sm" data-goto="'+esc(c.target)+'">Modifica il punto</button></div>';

  // ---- tutto quello che il database sa, in chiaro ----
  var seg = c.segnalazioni || [], vot = c.voti_singoli || [];

  h += '<details class="dett"><summary>Le '+seg.length+' segnalazioni di stato ricevute</summary><div class="corpo">';
  if(!seg.length) h += '<div class="vuoto">Nessuno ha ancora detto se funziona o no.</div>';
  seg.forEach(function(r){
    var tx={ok:'Funziona',works:'Lavori in corso',broken:'È rotta'}[r.status]||r.status;
    var cl={ok:'ok',works:'warn',broken:'bad'}[r.status]||'';
    h += '<div class="riga"><span class="q">'+esc(ago(r.created_at))+'</span>'+
         '<span class="v"><span class="pill '+cl+'">'+tx+'</span></span></div>';
  });
  h += '</div></details>';

  h += '<details class="dett"><summary>I '+vot.length+' voti con le stelle</summary><div class="corpo">';
  if(!vot.length) h += '<div class="vuoto">Nessuno ha ancora votato questa fontanella.</div>';
  vot.forEach(function(r){
    var v=[];
    if(r.findability!=null) v.push('raggiungibile '+r.findability+'/5');
    if(r.cleanliness!=null) v.push('stato '+r.cleanliness+'/5');
    if(r.taste!=null)       v.push('qualità '+r.taste+'/5');
    if(r.temperature!=null) v.push('acqua '+({1:'calda',3:'ambiente',5:'fresca'}[r.temperature]||r.temperature));
    h += '<div class="riga"><span class="q">'+esc(ago(r.created_at))+
         (r.approved?'':' <span class="pill bad">nascosto</span>')+'</span>'+
         '<span class="v">'+esc(v.join(' · ') || 'senza stelle')+
         (r.comment?'<br><span style="font-weight:400;color:var(--muted)">« '+esc(r.comment)+' »</span>':'')+
         '</span></div>';
  });
  h += '</div></details>';

  // ---- la carta d'identità del punto ----
  var righe = [];
  righe.push(['Tipo', c.tipo==='casa' ? "Casa dell'acqua (distributore)" : 'Fontanella pubblica']);
  righe.push(['Dove', c.via || (c.lat!=null ? c.lat.toFixed(6)+', '+c.lon.toFixed(6) : 'sconosciuto')]);
  if(c.lat!=null) righe.push(['Coordinate', c.lat.toFixed(6)+', '+c.lon.toFixed(6)]);
  righe.push(['Da dove viene', c.target.indexOf('osm/')===0
    ? 'OpenStreetMap (mappa collaborativa mondiale)'
    : 'Aggiunta da te o da una proposta approvata']);
  if(t.operator)  righe.push(['Chi la gestisce', t.operator]);
  if(t.drinking_water) righe.push(['Potabile secondo OSM', t.drinking_water==='yes' ? 'sì' : 'no']);
  if(t.fee)       righe.push(['Si paga', t.fee==='yes' ? 'sì' : 'no']);
  if(t.check_date) righe.push(['Ultimo controllo sul posto', t.check_date]);
  if(t.description) righe.push(['Descrizione su OSM', t.description]);
  righe.push(['Codice interno', c.target]);

  h += '<details class="dett"><summary>Carta d\'identità della fontanella</summary><div class="corpo">'+
       righe.map(function(r){
         return '<div class="riga"><span class="q">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span></div>';
       }).join('')+'</div></details>';

  if(c.foto && c.foto.length){
    h += '<div class="meta" style="margin-top:11px">Foto già pubblicate qui ('+c.foto.length+'):</div>'+
         '<div style="display:flex;gap:6px;overflow-x:auto;margin-top:6px">'+
         c.foto.slice(0,6).map(function(u){
           return '<img src="'+esc(u)+'" style="height:64px;border-radius:8px;flex:0 0 auto" loading="lazy" alt="">';
         }).join('')+'</div>';
  }
  return h;
}

/* Riempie gli indirizzi man mano che Nominatim risponde. */
function completaIndirizzi(coppie){
  coppie.forEach(function(x){
    var c = CTX[x.target];
    if(!c || c.lat == null) {
      var e0 = el('via-'+x.id);
      if(e0) e0.innerHTML = '<span style="color:var(--rotta)">Non riesco a leggere le coordinate '+
        'da OpenStreetMap in questo momento. Apri la scheda OSM qui sotto per vedere dov\'è.</span>';
      return;
    }
    if(c.via){ var e1 = el('via-'+x.id); if(e1) e1.textContent = c.via; return; }
    chiediVia(c.lat, c.lon, function(via){
      c.via = via;
      var e2 = el('via-'+x.id);
      if(e2) e2.textContent = via || (c.lat.toFixed(5)+', '+c.lon.toFixed(5));
    });
  });
}
function collegaVaiA(){
  el('view').querySelectorAll('[data-goto]').forEach(function(b){
    b.onclick=function(){ openEditorByTarget(b.getAttribute('data-goto')); };
  });
}
function store(k,v){
  try{ if(v===undefined) return sessionStorage.getItem(k);
       if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }
  catch(e){ return null; }
}

/* ---------- API ---------- */
function H(extra){
  var h={'apikey':CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json',
         'Authorization':'Bearer '+(TOKEN||CFG.SUPABASE_ANON_KEY)};
  return Object.assign(h, extra||{});
}
function api(path,opt){
  return fetch(CFG.SUPABASE_URL+'/rest/v1/'+path, opt||{headers:H()})
    .then(function(r){
      if(r.status===401){ logout(); throw new Error('scaduto'); }
      if(!r.ok) return r.text().then(function(t){ throw new Error(t||r.status); });
      return r.status===204 ? null : r.json();
    });
}
function sel(p){ return api(p,{headers:H()}); }
function patch(table,filter,body){
  return api(table+'?'+filter,{method:'PATCH',headers:H({'Prefer':'return=representation'}),
    body:JSON.stringify(body)});
}
function del(table,filter){
  return api(table+'?'+filter,{method:'DELETE',headers:H()});
}
function ins(table,body,extra){
  return api(table,{method:'POST',headers:H({'Prefer':extra||'return=representation'}),
    body:JSON.stringify(body)});
}
function rpc(fn,args){
  return api('rpc/'+fn,{method:'POST',headers:H(),body:JSON.stringify(args||{})});
}

/* ---------- LOGIN ---------- */
function login(){
  var e=el('em').value.trim(), p=el('pw').value;
  if(!CFG.SUPABASE_URL){ showErr('Manca la configurazione Supabase in admin.html.'); return; }
  if(!e||!p){ showErr('Inserisci email e password.'); return; }
  el('go').disabled=true; el('go').textContent='Verifico…';
  fetch(CFG.SUPABASE_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',headers:{'apikey':CFG.SUPABASE_ANON_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:e,password:p})
  }).then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.access_token) throw new Error(d.error_description||d.msg||'Credenziali non valide');
      TOKEN=d.access_token; USER=d.user;
      return rpc('is_admin');
    })
    .then(function(ok){
      if(ok!==true) throw new Error('Questo account non è amministratore.');
      store('idr_tk',TOKEN); store('idr_em',USER?USER.email:'');
      start();
    })
    .catch(function(err){ TOKEN=null; showErr(err.message||'Accesso non riuscito'); })
    .then(function(){ el('go').disabled=false; el('go').textContent='Entra'; });
}
function showErr(m){ var e=el('err'); e.textContent=m; e.style.display='block'; }
function logout(){
  TOKEN=null; store('idr_tk',null);
  el('app').hidden=true; el('login').style.display='block';
}
function start(){
  el('login').style.display='none';
  el('app').hidden=false;
  el('who').textContent=store('idr_em')||'';
  counters();
  go(tab);
}
el('go').onclick=login;
el('pw').addEventListener('keydown',function(e){ if(e.key==='Enter') login(); });
el('logout').onclick=logout;

/* ============================================================
   1. PROPOSTE
   ============================================================ */
function vQueue(){
  sel('submissions?select=*&state=eq.pending&order=created_at.asc').then(function(rows){
    if(!rows.length){ el('view').innerHTML='<div class="empty">Nessuna proposta in attesa.</div>'; return; }
    rows.forEach(function(s,i){
      chiediVia(s.lat, s.lon, function(via){
        var e2 = el('via-s'+i);
        if(e2) e2.textContent = via || (s.lat.toFixed(5)+', '+s.lon.toFixed(5));
      });
      pesaDispositivo(s.client_id).then(function(n){
        if(!n) return;
        var e3 = el('dev-s'+i);
        if(e3) e3.textContent = (s.client_id||'?').slice(0,10)+
          ' · '+n.foto+' foto, '+n.voti+' voti, '+n.proposte+' proposte in totale';
      });
    });
    el('view').innerHTML=rows.map(function(s,i){
      return '<div class="card" id="s-'+s.id+'">'+
        '<h3>'+esc(s.name||(s.kind==='casa'?"Casa dell'acqua":'Fontanella'))+'</h3>'+
        '<div class="meta" id="via-s'+i+'">cerco l\'indirizzo…</div>'+
        '<div class="pills"><span class="pill">'+
          (s.kind==='casa'?"casa dell'acqua":'fontanella')+'</span>'+
          '<span class="pill">'+s.lat.toFixed(5)+', '+s.lon.toFixed(5)+'</span></div>'+
        '<div class="meta">Proposta '+esc(ago(s.created_at))+
          ' · dispositivo <span id="dev-s'+i+'">'+esc((s.client_id||'?').slice(0,10))+'</span></div>'+
        (s.note?'<div class="meta" style="margin-top:7px;color:var(--ink)">'+esc(s.note)+'</div>':'')+
        (s.photo_path?'<img class="thumb" src="'+esc(photoUrl(s.photo_path))+'" alt="" loading="lazy">':'')+
        '<div class="row">'+
          '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+s.lat+','+s.lon+'">Vedi il posto</a>'+
          '<a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+s.lat+'&mlon='+s.lon+'#map=19/'+s.lat+'/'+s.lon+'">Su OSM</a>'+
        '</div>'+
        '<div class="row">'+
          '<button class="btn ok" data-ap="'+s.id+'">Approva</button>'+
          '<button class="btn bad" data-rj="'+s.id+'">Rifiuta</button>'+
        '</div></div>';
    }).join('');
    el('view').querySelectorAll('[data-ap]').forEach(function(b){
      b.onclick=function(){
        b.disabled=true;
        var id=b.getAttribute('data-ap');
        var sub=rows.filter(function(x){ return x.id===id; })[0];
        rpc('approve_submission',{sub_id:id})
          .then(function(nuovoId){
            if(!sub || !sub.photo_path) return;
            var fid=(typeof nuovoId==='string')?nuovoId.replace(/"/g,''):nuovoId;
            return patch('fountains','id=eq.'+fid,{photo_url:photoUrl(sub.photo_path)})
                     .catch(function(){});
          })
          .then(function(){ toast('Approvata: ora è sulla mappa.'); vQueue(); counters(); })
          .catch(function(e){ b.disabled=false; toast('Errore: '+e.message); });
      };
    });
    el('view').querySelectorAll('[data-rj]').forEach(function(b){
      b.onclick=function(){
        b.disabled=true;
        patch('submissions','id=eq.'+b.getAttribute('data-rj'),
              {state:'rejected',reviewed_at:new Date().toISOString()})
          .then(function(){ toast('Rifiutata.'); vQueue(); counters(); })
          .catch(function(e){ b.disabled=false; toast('Errore: '+e.message); });
      };
    });
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

function vReports(){
  Promise.all([
    sel('reports?select=*&order=created_at.desc&limit=80'),
    sel('v_status?select=*&order=broken_votes.desc&limit=40')
  ]).then(function(res){
    var recent=res[0], agg=res[1].filter(function(r){ return r.broken_votes>0 || r.works_votes>0; });
    var h='';

      h+='<div class="card"><h3>Da controllare</h3>'+
         '<div class="meta">Punti con segnalazioni di guasto o di cantiere.</div>';

        h+='<div class="stat"><span>'+esc(a.target)+'<br><span class="meta">'+
           '<span class="pill ok">'+a.ok_votes+' ok</span>'+
           (a.works_votes?'<span class="pill warn">'+a.works_votes+' lavori</span>':'')+
           '<span class="pill bad">'+a.broken_votes+' rotta</span>'+esc(ago(a.last_report))+'</span></span>'+
           '<button class="btn ghost sm" data-fix="'+esc(a.target)+'">Decidi</button></div>';
      });
      h+='</div>';
    }
    h+='<div class="card"><h3>Ultime segnalazioni</h3>';
    if(!recent.length) h+='<div class="meta">Ancora nessuna.</div>';
    recent.forEach(function(r){
      var cl={ok:'ok',works:'warn',broken:'bad'}[r.status]||'';
      var tx={ok:'funziona',works:'lavori',broken:'rotta'}[r.status]||r.status;
      h+='<div class="stat"><span class="meta">'+esc(r.target)+'</span>'+
         '<span><span class="pill '+cl+'">'+tx+'</span>'+esc(ago(r.created_at))+'</span></div>';

    el('view').querySelectorAll('[data-fix]').forEach(function(b){

}

/* ============================================================
   4. RECENSIONI

function vReviews(){
  sel('reviews?select=*&order=created_at.desc&limit=60').then(function(rows){
    if(!rows.length){ el('view').innerHTML='<div class="empty">Ancora nessun voto.</div>'; return; }

    return caricaContesti(rows.map(function(r){ return r.target; })).then(function(){
    el('view').innerHTML=rows.map(function(r,i){
      var c = CTX[r.target];
      var stars=[['findability','raggiungibile'],['cleanliness','stato'],['taste','qualità']]
        .filter(function(s){ return r[s[0]]; })
        .map(function(s){ return '<span class="pill">'+s[1]+' '+r[s[0]]+'★</span>'; }).join('');
      if(r.temperature){
        var nomi={1:'calda',3:'ambiente',5:'fresca'};

      }
      return '<div class="card">'+
        intestazione(c, 'r'+i)+
        '<div class="pills">'+stars+
          (r.approved?'':'<span class="pill bad">nascosto</span>')+'</div>'+
        (r.comment?'<div style="font-size:14.5px;line-height:1.45;padding:10px 12px;'+
          'background:rgba(7,36,47,.04);border-radius:10px">'+esc(r.comment)+'</div>':
          '<div class="meta">Nessun commento scritto.</div>')+
        '<div class="meta" style="margin-top:8px">Lasciato '+esc(ago(r.created_at))+
          ' · dispositivo <span id="dev-r'+i+'">'+esc((r.client_id||'?').slice(0,10))+'</span></div>'+
        '<div class="row">'+
        (r.approved
          ? '<button class="btn bad sm" data-hide="'+r.id+'">Nascondi</button>'
          : '<button class="btn ok sm" data-show="'+r.id+'">Ripubblica</button>')+
        '<button class="btn ghost sm" data-rm="'+r.id+'">Elimina</button></div></div>';
    }).join('');

    completaIndirizzi(rows.map(function(r,i){ return {target:r.target, id:'r'+i}; }));
    collegaVaiA();
    rows.forEach(function(r,i){
      pesaDispositivo(r.client_id).then(function(n){
        if(!n) return;
        var e2 = el('dev-r'+i);
        if(e2) e2.textContent = (r.client_id||'?').slice(0,10)+
          ' · '+n.foto+' foto, '+n.voti+' voti, '+n.proposte+' proposte in totale';
      });
    });

    var refresh=function(){ toast('Fatto.'); vReviews(); };
    el('view').querySelectorAll('[data-hide]').forEach(function(b){ b.onclick=function(){
      patch('reviews','id=eq.'+b.getAttribute('data-hide'),{approved:false}).then(refresh); }; });
    el('view').querySelectorAll('[data-show]').forEach(function(b){ b.onclick=function(){
      patch('reviews','id=eq.'+b.getAttribute('data-show'),{approved:true}).then(refresh); }; });
    el('view').querySelectorAll('[data-rm]').forEach(function(b){ b.onclick=function(){
      if(!confirm('Eliminare il voto?')) return;
      del('reviews','id=eq.'+b.getAttribute('data-rm')).then(refresh); }; });
    });
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ============================================================
   5. MAPPA + EDITOR (modifica qualsiasi punto)
   ============================================================ */
function vMap(){
  el('view').innerHTML=
    '<div class="card" style="padding:10px"><div id="map"></div>'+
    '<div class="meta">Tocca un punto per modificarlo. Verde: fontanella. Ambra: casa dell\'acqua. '+
    'Rosso: segnalata rotta. Bordo scuro: punto tuo, non presente su OpenStreetMap.</div>'+
    '<div class="row"><button class="btn ok sm" id="addHere">Aggiungi un punto al centro</button>'+
    '<button class="btn ghost sm" id="reload">Ricarica l\'area</button></div></div>'+
    '<div id="editor"></div>';

  setTimeout(function(){
    if(map){ map.remove(); map=null; }
    map=L.map('map',{zoomControl:true}).setView([45.4642,9.19],15);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {maxZoom:19,attribution:'&copy; OpenStreetMap, &copy; CARTO'}).addTo(map);
    layer=L.layerGroup().addTo(map);
    if(navigator.geolocation) navigator.geolocation.getCurrentPosition(function(p){
      map.setView([p.coords.latitude,p.coords.longitude],16); loadMap();
    },function(){ loadMap(); },{timeout:6000});
    else loadMap();
    map.on('moveend', loadMap);
    el('reload').onclick=loadMap;
    el('addHere').onclick=function(){
      var c=map.getCenter();
      openEditor({lat:+c.lat.toFixed(6), lon:+c.lng.toFixed(6), kind:'fontanella',
                  status:'ok', source:'admin', _new:true});
    };
  },40);
}
function loadMap(){
  if(!map) return;
  var c=map.getCenter(), d=0.03;
  Promise.all([
    sel('fountains?select=*&lat=gte.'+(c.lat-d)+'&lat=lte.'+(c.lat+d)+
        '&lon=gte.'+(c.lng-d)+'&lon=lte.'+(c.lng+d)+'&limit=600'),
    overpass(c),
    sel('v_status?select=*&limit=3000')
  ]).then(function(res){
    var db=res[0], osm=res[1], st={};
    res[2].forEach(function(r){ st[r.target]=r; });
    var ov={}; db.forEach(function(r){ if(r.osm_id) ov[r.osm_id]=r; });
    layer.clearLayers();

    osm.forEach(function(p){ pin(p, ov[p.id]||null, st['osm/'+p.id]); });
    db.forEach(function(r){ if(!r.osm_id) pin(
      {id:'db/'+r.id, lat:r.lat, lon:r.lon, kind:r.kind, tags:{name:r.name}}, r, st['db/'+r.id], true); });
  }).catch(function(e){ toast(e.message); });
}
function pin(p, ovr, stat, custom){
  var broken = (ovr && (ovr.status==='broken' || ovr.status==='works')) ||
               (stat && ((stat.works_votes||0) >= 1 ||
                        (stat.broken_votes>=2 && stat.broken_votes>stat.ok_votes)));
  var cls='pin'+(p.kind==='casa'?' casa':'')+(broken?' broken':'')+(custom?' custom':'');
  L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div class="'+cls+'"></div>',
    iconSize:[26,26],iconAnchor:[13,24]})})
   .on('click',function(){
      openEditor(ovr || {osm_id:(custom?null:p.id), lat:p.lat, lon:p.lon, kind:p.kind,
                         name:(p.tags&&p.tags.name)||'', status:'unknown', _new:true},
                 p);
   }).addTo(layer);
}
function overpass(c){
  var a='(around:1600,'+c.lat.toFixed(5)+','+c.lng.toFixed(5)+')';
  var q='[out:json][timeout:25];(nwr["amenity"="drinking_water"]'+a+';'+
        'nwr["man_made"="water_tap"]'+a+';nwr["amenity"="water_point"]'+a+';'+
        'nwr["amenity"="vending_machine"]["vending"~"water"]'+a+';);out center 300;';
  return fetch('https://overpass-api.de/api/interpreter',{method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q)})
    .then(function(r){ return r.json(); })
    .then(function(d){
      return (d.elements||[]).map(function(e){
        var lat=e.lat!=null?e.lat:(e.center&&e.center.lat);
        var lon=e.lon!=null?e.lon:(e.center&&e.center.lon);
        if(lat==null) return null;
        var t=e.tags||{};
        var kind=(t.amenity==='vending_machine'||t.amenity==='water_point')?'casa':'fontanella';
        return {id:e.type+'/'+e.id, lat:lat, lon:lon, tags:t, kind:kind};
      }).filter(Boolean);
    }).catch(function(){ return []; });
}
function openEditorByTarget(target){
  document.querySelectorAll('nav button').forEach(function(x){
    x.classList.toggle('on', x.getAttribute('data-t')==='map'); });
  var isDb = target.indexOf('db/')===0;
  var q = isDb ? 'fountains?select=*&id=eq.'+target.slice(3)
               : 'fountains?select=*&osm_id=eq.'+encodeURIComponent(target.slice(4));
  sel(q).then(function(rows){
    vMap();
    setTimeout(function(){
      if(rows.length) openEditor(rows[0]);
      else openEditor({osm_id:target.slice(4), lat:0, lon:0, kind:'fontanella',
                       status:'broken', status_locked:true, _new:true, _noGeo:true});
    },300);
  });
}
function openEditor(f, osmPoint){
  editing=f;
  var t=(osmPoint&&osmPoint.tags)||{};
  var h='<div class="card"><h3>'+(f._new?'Nuovo punto':'Modifica punto')+'</h3>'+
    '<div class="meta">'+(f.osm_id?'OpenStreetMap · '+esc(f.osm_id):'Punto tuo')+
    (f.id?' · id '+esc(f.id).slice(0,8):'')+'</div>';
  if(t.name||t.operator) h+='<div class="meta" style="margin-top:5px">OSM dice: '+esc(t.name||'')+' '+esc(t.operator||'')+'</div>';

  h+='<label>Nome</label><input id="fName" value="'+esc(f.name||'')+'" placeholder="Fontanella pubblica">';
  h+='<div class="grid2"><div><label>Tipo</label><select id="fKind">'+
      '<option value="fontanella"'+(f.kind!=='casa'?' selected':'')+'>Fontanella</option>'+
      '<option value="casa"'+(f.kind==='casa'?' selected':'')+'>Casa dell\'acqua</option></select></div>'+
      '<div><label>Stato</label><select id="fStatus">'+
      ['unknown|Sconosciuto','ok|Funzionante','works|Lavori in corso','broken|Rotta','removed|Rimossa'].map(function(o){
        var v=o.split('|'); return '<option value="'+v[0]+'"'+(f.status===v[0]?' selected':'')+'>'+v[1]+'</option>';
      }).join('')+'</select></div></div>';
  h+='<div class="grid2"><div><label>Costo</label><select id="fFee">'+
      '<option value="">Non specificato</option>'+
      '<option value="free"'+(f.fee==='free'?' selected':'')+'>Gratis</option>'+
      '<option value="paid"'+(f.fee==='paid'?' selected':'')+'>A pagamento</option></select></div>'+
      '<div><label>Potabilità</label><select id="fPot">'+
      '<option value="">Non specificata</option>'+
      '<option value="1"'+(f.potable===true?' selected':'')+'>Potabile</option>'+
      '<option value="0"'+(f.potable===false?' selected':'')+'>Non potabile</option></select></div></div>';
  h+='<label>Note pubbliche</label><textarea id="fNotes" rows="2">'+esc(f.notes||'')+'</textarea>';
  h+='<label>Foto ufficiale (URL)</label><input id="fPhoto" value="'+esc(f.photo_url||'')+'" placeholder="https://…">';
  h+='<div class="grid2"><div><label>Lat</label><input id="fLat" value="'+(f.lat||'')+'"></div>'+
      '<div><label>Lon</label><input id="fLon" value="'+(f.lon||'')+'"></div></div>';
  h+='<div class="check"><input type="checkbox" id="fCard"'+(f.requires_card?' checked':'')+
      '><label for="fCard" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)">Serve la tessera sanitaria</label></div>';
  h+='<div class="check"><input type="checkbox" id="fLock"'+(f.status_locked?' checked':'')+
      '><label for="fLock" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)">Blocca lo stato (i voti degli utenti non lo cambiano)</label></div>';
  h+='<div class="check"><input type="checkbox" id="fHide"'+(f.hidden?' checked':'')+
      '><label for="fHide" style="margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)">Nascondi dalla mappa pubblica</label></div>';
  h+='<div class="row"><button class="btn ok" id="fSave">Salva</button>'+
      '<button class="btn ghost" id="fCancel">Annulla</button>'+
      (f.id?'<button class="btn bad" id="fDel">Elimina</button>':'')+'</div></div>';

  el('editor').innerHTML=h;
  el('editor').scrollIntoView({behavior:'smooth',block:'start'});

  el('fCancel').onclick=function(){ el('editor').innerHTML=''; editing=null; };
  if(el('fDel')) el('fDel').onclick=function(){
    if(!confirm('Eliminare questo punto?')) return;
    del('fountains','id=eq.'+f.id).then(function(){
      toast('Eliminato.'); el('editor').innerHTML=''; loadMap(); });
  };
  el('fSave').onclick=function(){
    var pot=el('fPot').value;
    var body={
      osm_id: f.osm_id||null,
      lat:+el('fLat').value, lon:+el('fLon').value,
      kind:el('fKind').value,
      name:el('fName').value.trim()||null,
      notes:el('fNotes').value.trim()||null,
      status:el('fStatus').value,
      status_locked:el('fLock').checked,
      fee:el('fFee').value||null,
      potable: pot===''?null:(pot==='1'),
      requires_card:el('fCard').checked,
      hidden:el('fHide').checked,
      photo_url:el('fPhoto').value.trim()||null
    };
    if(!isFinite(body.lat)||!isFinite(body.lon)||!body.lat){ toast('Coordinate non valide.'); return; }
    var b=el('fSave'); b.disabled=true; b.textContent='Salvo…';
    var p = f.id
      ? patch('fountains','id=eq.'+f.id, body)
      : api('fountains?on_conflict=osm_id',{method:'POST',
          headers:H({'Prefer':'resolution=merge-duplicates,return=representation'}),
          body:JSON.stringify(body)});
    p.then(function(){ toast('Salvato.'); el('editor').innerHTML=''; loadMap(); })
     .catch(function(e){ b.disabled=false; b.textContent='Salva'; toast('Errore: '+e.message); });
  };
}

/* ============================================================
   6. NUMERI
   ============================================================ */
function vStats(){
  Promise.all([
    sel('fountains?select=id,osm_id,kind,status,source&limit=5000'),
    sel('reports?select=id,status,created_at&limit=5000'),
    sel('reviews?select=id&limit=5000'),
    sel('photos?select=id,approved&limit=5000'),
    sel('submissions?select=id,state&limit=5000')
  ]).then(function(r){
    var f=r[0],rep=r[1],rev=r[2],ph=r[3],sub=r[4];
    var week=rep.filter(function(x){ return Date.now()-new Date(x.created_at)<7*864e5; }).length;
    function row(l,v){ return '<div class="stat"><span>'+l+'</span><b>'+v+'</b></div>'; }
    el('view').innerHTML='<div class="card"><h3>Il tuo database</h3>'+
      row('Punti tuoi o modificati', f.length)+
      row('— di cui non su OSM', f.filter(function(x){ return !x.osm_id; }).length)+
      row('— segnati rotti', f.filter(function(x){ return x.status==='broken'; }).length)+
      row('Case dell\'acqua', f.filter(function(x){ return x.kind==='casa'; }).length)+
      '</div><div class="card"><h3>Partecipazione</h3>'+
      row('Segnalazioni di stato', rep.length)+
      row('— ultimi 7 giorni', week)+
      row('Voti con stelle', rev.length)+
      row('Foto pubblicate', ph.filter(function(x){ return x.approved; }).length)+
      row('Foto in attesa', ph.filter(function(x){ return !x.approved; }).length)+
      row('Proposte approvate', sub.filter(function(x){ return x.state==='approved'; }).length)+
      row('Proposte in attesa', sub.filter(function(x){ return x.state==='pending'; }).length)+
      '</div>';
  }).catch(function(e){ el('view').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; });
}

/* ---------- sessione ---------- */

if(saved && CFG.SUPABASE_URL){
  TOKEN=saved;
  rpc('is_admin').then(function(ok){ if(ok===true) start(); else logout(); })
                 .catch(function(){ logout(); });
}
})();
